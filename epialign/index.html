    // ============================================================================
    // 3. PARSING & SCHEMA DISCOVERY UTILITIES (EpiDoc XML & RDF)
    // ============================================================================

    const DISTINGUISHING_ATTRS = ['type', 'subtype', 'decls'];

    function buildSemanticXPath(el) {
      const parts = [];
      let curr = el;
      while (curr && curr.nodeType === 1) {
        const localName = curr.localName || curr.nodeName.replace(/^.*:/, '');
        const prefix = curr.namespaceURI && curr.namespaceURI.includes('tei-c.org') ? 'tei:' : '';
        let step = `${prefix}${localName}`;

        const qualifiers = [];
        for (const attr of DISTINGUISHING_ATTRS) {
          if (curr.hasAttribute && curr.hasAttribute(attr)) {
            qualifiers.push(`@${attr}='${curr.getAttribute(attr)}'`);
          }
        }
        if (qualifiers.length > 0) {
          step += `[${qualifiers.join(' and ')}]`;
        }
        parts.unshift(step);
        curr = curr.parentElement;
      }
      return '//' + parts.join('/');
    }

    function cleanEpigraphicText(el, editionStyle = 'interpretive') {
      const clone = el.cloneNode(true);
      clone.querySelectorAll('head').forEach((h) => h.remove());

      if (editionStyle === 'diplomatic') {
        clone.querySelectorAll('ex, supplied, corr, reg, note, desc, g').forEach((node) => node.remove());
      } else {
        clone.querySelectorAll('choice').forEach((choice) => {
          if (choice.querySelector('corr')) {
            choice.querySelectorAll('sic').forEach((n) => n.remove());
          }
          if (choice.querySelector('reg')) {
            choice.querySelectorAll('orig').forEach((n) => n.remove());
          }
        });
      }

      const lbs = clone.querySelectorAll('lb');
      lbs.forEach((lb, idx) => {
        const breakAttr = lb.getAttribute('break');
        const replacement = document.createTextNode(breakAttr === 'no' ? '' : idx === 0 ? '' : ' ');
        lb.parentNode.replaceChild(replacement, lb);
      });
      const text = (clone.textContent || '')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/^Text(?:\s*:|\s+(?=[A-Z0-9\[(⟨<]))/i, '')
        .trim();

      return editionStyle === 'diplomatic' ? text.toUpperCase() : text;
    }

    function extractXmlFieldsFromDoc(doc) {
      const fieldsMap = new Map();
      const allElements = doc.getElementsByTagName('*');

      for (let i = 0; i < allElements.length; i++) {
        const el = allElements[i];
        const basePath = buildSemanticXPath(el);
        const localName = el.localName || el.nodeName;
        const isEditionContainer =
          (localName === 'div' && (el.getAttribute('type') === 'edition' || el.getAttribute('type') === 'diplomatic')) ||
          localName === 'ab';
        const hasChildElements = Array.from(el.childNodes).some((n) => n.nodeType === 1);
        const cleanedText = cleanEpigraphicText(el);

        if ((!hasChildElements || isEditionContainer || localName === 'expan') && cleanedText) {
          const refUri =
            el.getAttribute('ref') || el.getAttribute('corresp') || el.getAttribute('ana') || null;
          const certVal =
            el.getAttribute('cert') || el.getAttribute('precision') || el.getAttribute('evidence') || null;

          if (!fieldsMap.has(basePath)) {
            fieldsMap.set(basePath, {
              path: basePath,
              format: 'EpiDoc XML',
              count: 0,
              samples: [],
              hasUri: false,
              hasCertainty: false,
              sampleUri: null,
              sampleCertainty: null
            });
          }
          const entry = fieldsMap.get(basePath);
          entry.count += 1;
          if (entry.samples.length < 3 && !entry.samples.includes(cleanedText)) {
            entry.samples.push(cleanedText);
          }
          if (refUri) {
            entry.hasUri = true;
            if (!entry.sampleUri) entry.sampleUri = refUri;
          }
          if (certVal) {
            entry.hasCertainty = true;
            if (!entry.sampleCertainty) entry.sampleCertainty = certVal;
          }
        }

        const valueAttrs = [
          'notBefore-custom',
          'notAfter-custom',
          'notBefore',
          'notAfter',
          'when-custom',
          'when',
          'from',
          'to',
          'value',
          'ref'
        ];
        for (const attrName of valueAttrs) {
          if (el.hasAttribute(attrName)) {
            const attrPath = `${basePath}/@${attrName}`;
            const attrVal = el.getAttribute(attrName);
            const certVal = el.getAttribute('cert') || el.getAttribute('precision') || null;
            if (!fieldsMap.has(attrPath)) {
              fieldsMap.set(attrPath, {
                path: attrPath,
                format: 'EpiDoc XML',
                count: 0,
                samples: [],
                hasUri: attrName === 'ref',
                hasCertainty: Boolean(certVal),
                sampleUri: attrName === 'ref' ? attrVal : null,
                sampleCertainty: certVal
              });
            }
            const entry = fieldsMap.get(attrPath);
            entry.count += 1;
            if (entry.samples.length < 3 && !entry.samples.includes(attrVal)) {
              entry.samples.push(attrVal);
            }
            if (certVal) {
              entry.hasCertainty = true;
              if (!entry.sampleCertainty) entry.sampleCertainty = certVal;
            }
          }
        }
      }

      return Array.from(fieldsMap.values());
    }

    function parseTurtleSimple(ttlText) {
      const prefixes = {};
      const lines = ttlText.split(/\r?\n/);
      const bodyLines = [];

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;
        const prefixMatch = trimmed.match(/^@?prefix\s+([a-zA-Z0-9_-]*:)\s*<([^>]+)>\s*\.?$/i);
        if (prefixMatch) {
          prefixes[prefixMatch[1]] = prefixMatch[2];
        } else {
          bodyLines.push(trimmed);
        }
      }

      const record = { '@id': null, _triples: {} };
      const joined = bodyLines.join(' ');
      const subjectMatch = joined.match(/^\s*<([^>]+)>/);
      if (subjectMatch) {
        record['@id'] = subjectMatch[1];
      }

      const withoutSubject = joined.replace(/^\s*<[^>]+>\s*/, '');
      const statements = withoutSubject.split(/\s*;\s*|\s+\.\s*$/).filter(Boolean);

      for (const stmt of statements) {
        const parts = stmt.trim().match(/^([^\s]+)\s+(.+)$/);
        if (!parts) continue;
        let pred = parts[1];
        let objRaw = parts[2].replace(/\s*\.\s*$/, '').trim();
        if (pred === 'a') pred = 'rdf:type';

        let value = objRaw;
        let uri = null;

        if (objRaw.startsWith('<') && objRaw.endsWith('>')) {
          uri = objRaw.slice(1, -1);
          value = uri.split('/').pop() || uri;
        } else if (objRaw.startsWith('"')) {
          const litMatch = objRaw.match(/^"([^"]*)"/);
          if (litMatch) value = litMatch[1];
        }

        if (!record._triples[pred]) record._triples[pred] = [];
        record._triples[pred].push({ value, uri });
      }

      return record;
    }

    function extractRdfFieldsFromFile(file) {
      const fieldsMap = new Map();

      const registerField = (pred, sampleVal, uri, certainty) => {
        if (!fieldsMap.has(pred)) {
          fieldsMap.set(pred, {
            path: pred,
            format: file.format,
            count: 0,
            samples: [],
            hasUri: false,
            hasCertainty: false,
            sampleUri: null,
            sampleCertainty: null
          });
        }
        const entry = fieldsMap.get(pred);
        entry.count += 1;
        const strVal = String(sampleVal);
        if (entry.samples.length < 3 && !entry.samples.includes(strVal)) {
          entry.samples.push(strVal);
        }
        if (uri) {
          entry.hasUri = true;
          if (!entry.sampleUri) entry.sampleUri = uri;
        }
        if (certainty) {
          entry.hasCertainty = true;
          if (!entry.sampleCertainty) entry.sampleCertainty = certainty;
        }
      };

      if (file.format.includes('JSON-LD')) {
        try {
          const data = JSON.parse(file.content);
          const graphs = Array.isArray(data['@graph']) ? data['@graph'] : [data];

          const walkObject = (obj, prefix = '') => {
            if (!obj || typeof obj !== 'object') return;
            const localCert = obj['epont:certainty'] || obj['certainty'] || null;
            const localId = obj['@id'] || obj['owl:sameAs'] || null;

            for (const [key, val] of Object.entries(obj)) {
              if (key === '@context' || key === '@type') continue;
              const fullPred = prefix ? `${prefix} → ${key}` : key;

              if (key === '@id' && !prefix) {
                registerField('@id', val, val, null);
                continue;
              }

              const items = Array.isArray(val) ? val : [val];
              for (const item of items) {
                if (item && typeof item === 'object') {
                  const label =
                    item['skos:prefLabel'] ||
                    item['@value'] ||
                    item['rdfs:label'] ||
                    item['@id'] ||
                    null;
                  const itemUri = item['@id'] || item['owl:sameAs'] || localId;
                  const itemCert = item['epont:certainty'] || localCert;
                  if (label) {
                    registerField(fullPred, label, itemUri, itemCert);
                  }
                  walkObject(item, fullPred);
                } else if (item !== null && item !== undefined) {
                  registerField(fullPred, item, localId, localCert);
                }
              }
            }
          };

          graphs.forEach((g) => walkObject(g));
        } catch (e) {
          console.error('JSON-LD parse error', e);
        }
      } else {
        const parsed = parseTurtleSimple(file.content);
        if (parsed['@id']) {
          registerField('@id (Subject URI)', parsed['@id'], parsed['@id'], null);
        }
        const globalCert =
          parsed._triples['epont:certainty']?.[0]?.value || null;
        for (const [pred, entries] of Object.entries(parsed._triples)) {
          for (const ent of entries) {
            registerField(pred, ent.value, ent.uri, globalCert);
          }
        }
      }

      return Array.from(fieldsMap.values());
    }

    // ============================================================================
    // 4. TRANSFORMATION ENGINE (Files + User Alignments -> Target JSON)
    // ============================================================================

    function evaluateXmlXPathLike(doc, xpathExpr, options) {
      const isAttr = xpathExpr.includes('/@');
      let elemPath = xpathExpr;
      let targetAttr = null;

      if (isAttr) {
        const splitIdx = xpathExpr.lastIndexOf('/@');
        elemPath = xpathExpr.slice(0, splitIdx);
        targetAttr = xpathExpr.slice(splitIdx + 2);
      }

      const allElements = doc.getElementsByTagName('*');
      const results = [];

      for (let i = 0; i < allElements.length; i++) {
        const el = allElements[i];
        const currentPath = buildSemanticXPath(el);
        if (currentPath !== elemPath) continue;

        let rawValue = null;
        if (targetAttr) {
          rawValue = el.getAttribute(targetAttr);
        } else if (options.textMode === 'raw') {
          rawValue = el.innerHTML.trim();
        } else if (options.textMode === 'diplomatic') {
          rawValue = cleanEpigraphicText(el, 'diplomatic');
        } else {
          rawValue = cleanEpigraphicText(el, 'interpretive');
        }

        if (!rawValue) continue;

        const uri =
          el.getAttribute('ref') ||
          el.getAttribute('corresp') ||
          el.getAttribute('ana') ||
          (targetAttr === 'ref' ? rawValue : null);
        const certainty =
          el.getAttribute('cert') ||
          el.getAttribute('precision') ||
          el.getAttribute('evidence') ||
          null;
        const placeType = !targetAttr ? el.getAttribute('type') || null : null;

        const item = { value: rawValue };
        if (placeType) {
          item.type = placeType;
        }
        if (options.includeUri && uri) {
          item.uri = uri;
        }
        if (options.includeCertainty && certainty) {
          item.certainty = certainty;
        }
        results.push(item);
      }

      return results;
    }

    function evaluateRdfPredicate(file, predPath, options) {
      const results = [];

      if (file.format.includes('JSON-LD')) {
        try {
          const data = JSON.parse(file.content);
          const graphs = Array.isArray(data['@graph']) ? data['@graph'] : [data];

          const searchNode = (obj, prefix = '') => {
            if (!obj || typeof obj !== 'object') return;
            const localCert = obj['epont:certainty'] || obj['certainty'] || null;
            const localId = obj['@id'] || obj['owl:sameAs'] || null;

            for (const [key, val] of Object.entries(obj)) {
              if (key === '@context' || key === '@type') continue;
              const fullPred = prefix ? `${prefix} → ${key}` : key;
              const items = Array.isArray(val) ? val : [val];

              if (fullPred === predPath) {
                for (const item of items) {
                  if (item && typeof item === 'object') {
                    const label =
                      item['skos:prefLabel'] ||
                      item['@value'] ||
                      item['rdfs:label'] ||
                      item['@id'];
                    const uri = item['@id'] || item['owl:sameAs'] || localId;
                    const cert = item['epont:certainty'] || localCert;
                    if (label !== undefined && label !== null) {
                      const resObj = { value: label };
                      if (options.includeUri && uri) resObj.uri = uri;
                      if (options.includeCertainty && cert) resObj.certainty = cert;
                      results.push(resObj);
                    }
                  } else if (item !== null && item !== undefined) {
                    const resObj = { value: item };
                    if (options.includeUri && localId) resObj.uri = localId;
                    if (options.includeCertainty && localCert) resObj.certainty = localCert;
                    results.push(resObj);
                  }
                }
              }

              for (const item of items) {
                if (item && typeof item === 'object') {
                  searchNode(item, fullPred);
                }
              }
            }
          };

          graphs.forEach((g) => searchNode(g));
        } catch (e) {
          console.error(e);
        }
      } else {
        const parsed = parseTurtleSimple(file.content);
        const globalCert = parsed._triples['epont:certainty']?.[0]?.value || null;
        if (predPath === '@id (Subject URI)' && parsed['@id']) {
          const resObj = { value: parsed['@id'] };
          if (options.includeUri) resObj.uri = parsed['@id'];
          results.push(resObj);
        } else if (parsed._triples[predPath]) {
          for (const ent of parsed._triples[predPath]) {
            const resObj = { value: ent.value };
            if (options.includeUri && ent.uri) resObj.uri = ent.uri;
            if (options.includeCertainty && globalCert) resObj.certainty = globalCert;
            results.push(resObj);
          }
        }
      }

      return results;
    }

    function transformFileToTargetJson(file, mappings) {
      const parser = new DOMParser();
      const xmlDoc =
        file.format === 'EpiDoc XML' ? parser.parseFromString(file.content, 'application/xml') : null;

      const extractForTarget = (targetKey) => {
        const rules = mappings[targetKey] || [];
        const collected = [];

        for (const rule of rules) {
          if (file.format === 'EpiDoc XML' && xmlDoc) {
            const matches = evaluateXmlXPathLike(xmlDoc, rule.sourcePath, rule);
            collected.push(...matches);
          } else if (file.format !== 'EpiDoc XML') {
            const matches = evaluateRdfPredicate(file, rule.sourcePath, rule);
            collected.push(...matches);
          }
        }
        return collected;
      };

      const formatSingleOrArray = (items, allowArray, isText = false, isNumeric = false) => {
        if (!items || items.length === 0) return 'N/A';
        if (isText) {
          return items[0].value;
        }
        if (isNumeric) {
          const first = { ...items[0] };
          const str = String(first.value).trim();
          if (/^[+-]?\d+(\.\d+)?$/.test(str)) {
            first.value = Number(str);
          }
          return allowArray ? [first] : first;
        }
        if (!allowArray) {
          return items[0];
        }
        return items;
      };

      const provinceItems = extractForTarget('geography_province');
      const placeItems = extractForTarget('geography_ancient_place_name');
      const latItems = extractForTarget('geography_latitude');
      const lonItems = extractForTarget('geography_longitude');

      let parsedLat = null;
      let parsedLon = null;

      if (latItems.length > 0) {
        const rawLat = String(latItems[0].value).trim();
        if (rawLat.includes(' ')) {
          const parts = rawLat.split(/\s+/);
          parsedLat = parseFloat(parts[0]);
          if (lonItems.length === 0 && parts[1]) {
            parsedLon = parseFloat(parts[1]);
          }
        } else {
          parsedLat = isNaN(parseFloat(rawLat)) ? rawLat : parseFloat(rawLat);
        }
      }

      if (lonItems.length > 0) {
        const rawLon = String(lonItems[0].value).trim();
        if (rawLon.includes(' ')) {
          const parts = rawLon.split(/\s+/);
          parsedLon = parseFloat(parts[1] || parts[0]);
        } else {
          parsedLon = isNaN(parseFloat(rawLon)) ? rawLon : parseFloat(rawLon);
        }
      }

      const formattedProvinces = provinceItems.map((p) => {
        const obj = { value: p.value };
        if (p.type) obj.type = p.type;
        if (p.uri) obj.uri = p.uri;
        if (p.certainty) obj.certainty = p.certainty;
        return obj;
      });

      const formattedAncientPlaces = placeItems.map((p) => {
        const obj = { value: p.value };
        if (p.type) obj.type = p.type;
        if (p.uri) obj.uri = p.uri;
        if (p.certainty) obj.certainty = p.certainty;
        return obj;
      });

      const hasGeoData =
        formattedProvinces.length > 0 ||
        formattedAncientPlaces.length > 0 ||
        (parsedLat !== null && !Number.isNaN(parsedLat)) ||
        (parsedLon !== null && !Number.isNaN(parsedLon));

      const geographyOutput = hasGeoData
        ? {
            province: formattedProvinces.length > 0 ? formattedProvinces : 'N/A',
            ancient_place_name: formattedAncientPlaces.length > 0 ? formattedAncientPlaces : 'N/A',
            latitude: parsedLat !== null && !Number.isNaN(parsedLat) ? parsedLat : 'N/A',
            longitude: parsedLon !== null && !Number.isNaN(parsedLon) ? parsedLon : 'N/A'
          }
        : 'N/A';

      return {
        _source_file: file.name,
        _source_format: file.format,
        id: formatSingleOrArray(extractForTarget('id'), false),
        provenance_corpus: formatSingleOrArray(extractForTarget('provenance_corpus'), true),
        interpretive_text: formatSingleOrArray(extractForTarget('interpretive_text'), false, true),
        diplomatic_text: formatSingleOrArray(extractForTarget('diplomatic_text'), false, true),
        start_date: formatSingleOrArray(extractForTarget('start_date'), false, false, true),
        end_date: formatSingleOrArray(extractForTarget('end_date'), false, false, true),
        material: formatSingleOrArray(extractForTarget('material'), true),
        type_of_object: formatSingleOrArray(extractForTarget('type_of_object'), true),
        type_of_inscription: formatSingleOrArray(extractForTarget('type_of_inscription'), true),
        geography: geographyOutput
      };
    }

    // ============================================================================
    // 5. DEFAULT SUGGESTED MAPPINGS HELPER
    // ============================================================================

    const AUTO_SUGGEST_RULES = {
      id: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:publicationStmt/tei:idno',
        'dcterms:identifier'
      ],
      provenance_corpus: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:publicationStmt/tei:authority',
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:publicationStmt/tei:publisher',
        'dcterms:isPartOf → skos:prefLabel',
        'dcterms:isPartOf'
      ],
      interpretive_text: [
        "//tei:TEI/tei:text/tei:body/tei:div[@type='edition']",
        "//tei:TEI/tei:text/tei:body/tei:div[@type='edition' and @subtype='interpretive']",
        'epont:hasInterpretiveText'
      ],
      diplomatic_text: [

        "//tei:TEI/tei:text/tei:body/tei:div[@type='edition' and @subtype='interpretive']",
        "//tei:TEI/tei:text/tei:body/tei:div[@type='diplomatic']",
        "//tei:TEI/tei:text/tei:body/tei:div[@type='edition' and @subtype='diplomatic']",

      ],
      start_date: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origDate/@notBefore-custom',
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origDate/@notBefore',
        'crm:P4_has_time-span → crm:P82a_begin_of_the_begin',
        'crm:P82a_begin_of_the_begin'
      ],
      end_date: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origDate/@notAfter-custom',
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origDate/@notAfter',
        'crm:P4_has_time-span → crm:P82b_end_of_the_end',
        'crm:P82b_end_of_the_end'
      ],
      material: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:physDesc/tei:objectDesc/tei:supportDesc/tei:support/tei:material',
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:physDesc/tei:objectDesc/tei:supportDesc/tei:support/tei:rs[@type='material']",
        'crm:P45_consists_of',
        'epont:materialLabel'
      ],
      type_of_object: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:physDesc/tei:objectDesc/tei:supportDesc/tei:support/tei:objectType',
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:physDesc/tei:objectDesc/tei:supportDesc/tei:support/tei:rs[@type='objectType']",
        'epont:hasObjectType',
        'epont:objectTypeLabel'
      ],
      type_of_inscription: [
        "//tei:TEI/tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='inscriptionType']",
        "//tei:TEI/tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='genre']",
        'epont:hasInscriptionType',
        'epont:inscriptionTypeLabel'
      ],
      geography_province: [
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origPlace/tei:placeName[@type='province']",
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:provenance[@type='found']/tei:placeName[@type='province']",
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origPlace/tei:region",
        'epont:hasProvince'
      ],
      geography_ancient_place_name: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origPlace/tei:placeName',
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:provenance[@type='found']/tei:placeName",
        'dcterms:spatial → skos:prefLabel',
        'skos:prefLabel'
      ],
      geography_latitude: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origPlace/tei:geo',
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:provenance[@type='found']/tei:location/tei:geo[@decls='#lat']",
        'dcterms:spatial → geo:lat',
        'geo:lat'
      ],
      geography_longitude: [
        '//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:origin/tei:origPlace/tei:geo',
        "//tei:TEI/tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:history/tei:provenance[@type='found']/tei:location/tei:geo[@decls='#long']",
        'dcterms:spatial → geo:long',
        'geo:long'
      ]
    };

    // ============================================================================
    // 6. MAIN REACT DASHBOARD COMPONENT
    // ============================================================================

    function App() {
      const [inputMode, setInputMode] = useState('XML');
      const [filesByMode, setFilesByMode] = useState({ XML: [], RDF: [] });
      const [mappingsByMode, setMappingsByMode] = useState({ XML: {}, RDF: {} });

      const files = filesByMode[inputMode] || [];
      const mappings = mappingsByMode[inputMode] || {};

      const [lodGeoCache, setLodGeoCache] = useState({
        'https://pleiades.stoa.org/places/423025': { lat: 41.89193, lon: 12.51133, source: 'Pleiades LOD' },
        'https://pleiades.stoa.org/places/89105': { lat: 55.0033, lon: -1.4317, source: 'Pleiades LOD' },
        'https://pleiades.stoa.org/places/89132': { lat: 52.5, lon: -1.5, source: 'Pleiades LOD' },
        'https://pleiades.stoa.org/places/462503': { lat: 37.0755, lon: 15.2866, source: 'Pleiades LOD' },
        'https://pleiades.stoa.org/places/462492': { lat: 37.5, lon: 14.0, source: 'Pleiades LOD' }
      });
      const [resolvingLodUris, setResolvingLodUris] = useState(false);
      const inFlightLodUrisRef = useRef(new Set());

      const [fieldSearch, setFieldSearch] = useState('');
      const [draggedField, setDraggedField] = useState(null);
      const [dragOverTarget, setDragOverTarget] = useState(null);
      const [openDropdownTarget, setOpenDropdownTarget] = useState(null);
      const [dropdownSearch, setDropdownSearch] = useState('');
      const [selectedPreviewIdx, setSelectedPreviewIdx] = useState('ALL');
      const [inspectedRule, setInspectedRule] = useState(null);
      const [copiedJson, setCopiedJson] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [uploadError, setUploadError] = useState(null);
      const [activeTabMobile, setActiveTabMobile] = useState('workspace');
      const [verifierViewMode, setVerifierViewMode] = useState('split');
      const [selectedVerifierFile, setSelectedVerifierFile] = useState('ALL');

      const fileInputRef = useRef(null);
      const profileInputRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      const discoveredFields = useMemo(() => {
        const combined = new Map();
        const parser = new DOMParser();

        for (const file of files) {
          let extracted = [];
          if (inputMode === 'XML' && file.format === 'EpiDoc XML') {
            const doc = parser.parseFromString(file.content, 'application/xml');
            if (!doc.querySelector('parsererror')) {
              extracted = extractXmlFieldsFromDoc(doc, file.name);
            }
          } else if (inputMode === 'RDF' && file.format !== 'EpiDoc XML') {
            extracted = extractRdfFieldsFromFile(file);
          }

          for (const item of extracted) {
            const key = `${item.format}::${item.path}`;
            if (!combined.has(key)) {
              combined.set(key, {
                ...item,
                key,
                files: [file.name]
              });
            } else {
              const existing = combined.get(key);
              existing.count += item.count;
              if (!existing.files.includes(file.name)) {
                existing.files.push(file.name);
              }
              for (const s of item.samples) {
                if (existing.samples.length < 3 && !existing.samples.includes(s)) {
                  existing.samples.push(s);
                }
              }
              existing.hasUri = existing.hasUri || item.hasUri;
              existing.hasCertainty = existing.hasCertainty || item.hasCertainty;
            }
          }
        }

        return Array.from(combined.values());
      }, [files, inputMode]);

      const discoveredFieldLookup = useMemo(() => {
        const map = new Map();
        discoveredFields.forEach((f) => {
          map.set(`${f.format}::${f.path}`, f);
        });
        return map;
      }, [discoveredFields]);

      const filteredDiscoveredFields = useMemo(() => {
        const q = fieldSearch.toLowerCase().trim();
        if (!q) return discoveredFields;
        return discoveredFields.filter(
          (f) =>
            f.path.toLowerCase().includes(q) ||
            f.samples.some((s) => s.toLowerCase().includes(q))
        );
      }, [discoveredFields, fieldSearch]);

      const buildSuggestedMappingsForFields = (fieldsList) => {
        const nextMappings = {};
        for (const target of TARGET_FIELDS) {
          const candidatePaths = AUTO_SUGGEST_RULES[target.key] || [];
          const matchedRules = [];
          for (const cand of candidatePaths) {
            const found = fieldsList.find((df) => df.path === cand);
            if (found) {
              matchedRules.push({
                id: `${target.key}-${found.path}-${Math.random().toString(36).slice(2, 7)}`,
                sourcePath: found.path,
                format: found.format,
                includeUri: true,
                includeCertainty: true,
                textMode: target.key === 'diplomatic_text' ? 'diplomatic' : 'clean'
              });
            }
          }
          if (matchedRules.length > 0) {
            nextMappings[target.key] = matchedRules;
          }
        }
        return nextMappings;
      };

      const handleModeSwitch = (nextMode) => {
        if (nextMode === inputMode) return;
        setInputMode(nextMode);
        setSelectedPreviewIdx('ALL');
        setInspectedRule(null);
        setFieldSearch('');
        setOpenDropdownTarget(null);
        setUploadError(null);
        showToast(
          `Switched to ${
            nextMode === 'XML' ? 'EpiDoc XML (.xml)' : 'RDF (JSON-LD / Turtle)'
          } workflow.`
        );
      };

      const applyAutoSuggest = (notify = true) => {
        const suggested = buildSuggestedMappingsForFields(discoveredFields);
        setMappingsByMode((prev) => ({
          ...prev,
          [inputMode]: suggested
        }));
        const firstKey = Object.keys(suggested)[0];
        if (firstKey && suggested[firstKey]?.[0]) {
          setInspectedRule({ targetKey: firstKey, rule: suggested[firstKey][0] });
        }
        if (notify) {
          showToast(
            `Auto-aligned standard ${
              inputMode === 'XML' ? 'EpiDoc TEI XPaths' : 'RDF predicates'
            } to target attributes.`
          );
        }
      };

      const addMappingRule = (targetKey, fieldObj) => {
        const newRule = {
          id: `${targetKey}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          sourcePath: fieldObj.path,
          format: fieldObj.format,
          includeUri: true,
          includeCertainty: true,
          textMode: targetKey === 'diplomatic_text' ? 'diplomatic' : 'clean'
        };

        setMappingsByMode((prev) => {
          const modeMappings = prev[inputMode] || {};
          const current = modeMappings[targetKey] || [];
          if (current.some((r) => r.sourcePath === fieldObj.path && r.format === fieldObj.format)) {
            showToast('This input path is already aligned to this target field.');
            return prev;
          }
          return {
            ...prev,
            [inputMode]: {
              ...modeMappings,
              [targetKey]: [...current, newRule]
            }
          };
        });
        setInspectedRule({ targetKey, rule: newRule });
        setOpenDropdownTarget(null);
        setDropdownSearch('');
      };

      const removeMappingRule = (targetKey, ruleId) => {
        setMappingsByMode((prev) => {
          const modeMappings = prev[inputMode] || {};
          const updated = (modeMappings[targetKey] || []).filter((r) => r.id !== ruleId);
          const nextModeMappings = { ...modeMappings };
          if (updated.length === 0) {
            delete nextModeMappings[targetKey];
          } else {
            nextModeMappings[targetKey] = updated;
          }
          return {
            ...prev,
            [inputMode]: nextModeMappings
          };
        });
        setInspectedRule((prev) => (prev?.rule?.id === ruleId ? null : prev));
      };

      const updateRuleOption = (targetKey, ruleId, patch) => {
        setMappingsByMode((prev) => {
          const modeMappings = prev[inputMode] || {};
          return {
            ...prev,
            [inputMode]: {
              ...modeMappings,
              [targetKey]: (modeMappings[targetKey] || []).map((r) =>
                r.id === ruleId ? { ...r, ...patch } : r
              )
            }
          };
        });
        setInspectedRule((prev) =>
          prev?.rule?.id === ruleId
            ? { ...prev, rule: { ...prev.rule, ...patch } }
            : prev
        );
      };

      const handleFileUpload = (e) => {
        const uploaded = Array.from(e.target.files || []);
        if (uploaded.length === 0) return;
        setUploadError(null);

        uploaded.forEach((file) => {
          const lower = file.name.toLowerCase();
          const isXmlExt = lower.endsWith('.xml');
          const isRdfExt =
            lower.endsWith('.jsonld') ||
            lower.endsWith('.ttl') ||
            lower.endsWith('.rdf') ||
            lower.endsWith('.json');

          if (inputMode === 'XML' && !isXmlExt) {
            setUploadError(
              `Rejected "${file.name}": EpiDoc XML mode accepts only .xml files. Switch Step 1 to RDF to upload RDF datasets.`
            );
            return;
          }

          if (inputMode === 'RDF' && !isRdfExt) {
            setUploadError(
              `Rejected "${file.name}": RDF mode accepts only .jsonld, .ttl, or .rdf files. Switch Step 1 to EpiDoc XML for TEI XML files.`
            );
            return;
          }

          const reader = new FileReader();
          reader.onload = (ev) => {
            const content = ev.target?.result;
            if (typeof content !== 'string') return;

            let format = 'EpiDoc XML';
            if (inputMode === 'RDF') {
              if (lower.endsWith('.jsonld') || lower.endsWith('.json')) {
                format = 'RDF (JSON-LD)';
              } else if (lower.endsWith('.ttl')) {
                format = 'RDF (Turtle)';
              } else {
                format = 'RDF (RDF-XML)';
              }
            }

            setFilesByMode((prev) => ({
              ...prev,
              [inputMode]: [
                ...(prev[inputMode] || []),
                {
                  id: `upload-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  name: file.name,
                  format,
                  description: 'Uploaded researcher dataset',
                  content
                }
              ]
            }));
            showToast(`Loaded ${file.name} (${format})`);
          };
          reader.readAsText(file);
        });
        e.target.value = '';
      };

      const removeFile = (fileId) => {
        setFilesByMode((prev) => ({
          ...prev,
          [inputMode]: (prev[inputMode] || []).filter((f) => f.id !== fileId)
        }));
        setSelectedPreviewIdx('ALL');
      };

      const loadTestDatasets = () => {
        setUploadError(null);
        const sampleSubset = SAMPLE_FILES.filter((f) =>
          inputMode === 'XML' ? f.format === 'EpiDoc XML' : f.format !== 'EpiDoc XML'
        );
        setFilesByMode((prev) => ({
          ...prev,
          [inputMode]: sampleSubset
        }));
        setSelectedPreviewIdx('ALL');
        showToast(
          `Loaded built-in ${
            inputMode === 'XML' ? 'EpiDoc XML' : 'RDF (JSON-LD & Turtle)'
          } test datasets.`
        );
      };

      const handleExportProfile = () => {
        const profile = {
          schema_version: '1.1',
          input_format: inputMode === 'XML' ? 'EpiDoc XML' : 'RDF',
          exported_at: new Date().toISOString(),
          description: `Epigraphic Data (${
            inputMode === 'XML' ? 'EpiDoc XML' : 'RDF'
          }) to JSON Field Alignment Profile`,
          mappings
        };
        const blob = new Blob([JSON.stringify(profile, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `epigraphic-${inputMode.toLowerCase()}-alignment-profile.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Exported ${inputMode} alignment profile (.json).`);
      };

      const handleImportProfile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target?.result);
            if (parsed && parsed.mappings && typeof parsed.mappings === 'object') {
              const profileMode =
                parsed.input_format === 'RDF'
                  ? 'RDF'
                  : parsed.input_format === 'EpiDoc XML'
                  ? 'XML'
                  : inputMode;
              setInputMode(profileMode);
              setMappingsByMode((prev) => ({
                ...prev,
                [profileMode]: parsed.mappings
              }));
              showToast(`Imported ${profileMode} alignment profile from ${file.name}`);
            } else {
              showToast('Invalid profile JSON: missing "mappings" object.');
            }
          } catch (err) {
            showToast('Could not parse profile JSON file.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const mandatoryFields = TARGET_FIELDS.filter((f) => f.group === 'mandatory');
      const unmappedMandatory = mandatoryFields.filter(
        (f) => !mappings[f.key] || mappings[f.key].length === 0
      );
      const isValidForExport = unmappedMandatory.length === 0 && files.length > 0;

      useEffect(() => {
        const candidateUris = new Set();
        files.forEach((file) => {
          const baseRec = transformFileToTargetJson(file, mappings);
          if (baseRec.geography && typeof baseRec.geography === 'object') {
            const places = Array.isArray(baseRec.geography.ancient_place_name)
              ? baseRec.geography.ancient_place_name
              : [];
            const provinces = Array.isArray(baseRec.geography.province)
              ? baseRec.geography.province
              : [];
            [...places, ...provinces].forEach((entry) => {
              if (entry && entry.uri) {
                const normalized = entry.uri.replace(/^http:\/\//i, 'https://').replace(/\/$/, '');
                const alreadyCached = normalized in lodGeoCache || entry.uri in lodGeoCache;
                const alreadyRequested = inFlightLodUrisRef.current.has(normalized);
                if (!alreadyCached && !alreadyRequested) {
                  candidateUris.add(normalized);
                }
              }
            });
          }
        });

        if (candidateUris.size === 0) return;

        candidateUris.forEach((u) => inFlightLodUrisRef.current.add(u));
        let cancelled = false;
        setResolvingLodUris(true);

        const resolveUri = async (uri) => {
          try {
            const pleiadesMatch = uri.match(/^https?:\/\/pleiades\.stoa\.org\/places\/(\d+)/i);
            if (pleiadesMatch) {
              const resp = await fetch(`https://pleiades.stoa.org/places/${pleiadesMatch[1]}/json`);
              if (resp.ok) {
                const data = await resp.json();
                const reprPoint = Array.isArray(data.reprPoint) ? data.reprPoint : null;
                if (reprPoint && reprPoint.length >= 2) {
                  return {
                    uri,
                    coords: {
                      lon: Number(reprPoint[0]),
                      lat: Number(reprPoint[1]),
                      source: 'Pleiades LOD'
                    }
                  };
                }
              }
            }

            const geonamesMatch = uri.match(/^https?:\/\/(?:www\.)?geonames\.org\/(\d+)/i);
            if (geonamesMatch) {
              const resp = await fetch(
                `https://secure.geonames.org/getJSON?geonameId=${geonamesMatch[1]}&username=demo`
              );
              if (resp.ok) {
                const data = await resp.json();
                if (data.lat !== undefined && data.lng !== undefined) {
                  return {
                    uri,
                    coords: {
                      lat: Number(data.lat),
                      lon: Number(data.lng),
                      source: 'GeoNames LOD'
                    }
                  };
                }
              }
            }
          } catch (err) {}
          return { uri, coords: null };
        };

        Promise.all(Array.from(candidateUris).map(resolveUri)).then((results) => {
          if (cancelled) return;
          setLodGeoCache((prev) => {
            const next = { ...prev };
            results.forEach(({ uri, coords }) => {
              next[uri] = coords;
            });
            return next;
          });
          setResolvingLodUris(false);
        });

        return () => {
          cancelled = true;
        };
      }, [files, mappings]);

      const transformedRecords = useMemo(() => {
        return files.map((file) => {
          const rec = transformFileToTargetJson(file, mappings);
          if (
            rec.geography &&
            typeof rec.geography === 'object' &&
            (rec.geography.latitude === 'N/A' || rec.geography.longitude === 'N/A')
          ) {
            const ancientPlaces = Array.isArray(rec.geography.ancient_place_name)
              ? rec.geography.ancient_place_name
              : [];
            const provinces = Array.isArray(rec.geography.province)
              ? rec.geography.province
              : [];
            const candidateEntries = [...ancientPlaces, ...provinces];

            for (const entry of candidateEntries) {
              if (!entry?.uri) continue;
              const normalized = entry.uri.replace(/^http:\/\//i, 'https://').replace(/\/$/, '');
              const resolved = lodGeoCache[normalized] || lodGeoCache[entry.uri];
              if (resolved && resolved.lat !== undefined && resolved.lon !== undefined) {
                rec.geography = {
                  ...rec.geography,
                  latitude: rec.geography.latitude === 'N/A' ? resolved.lat : rec.geography.latitude,
                  longitude: rec.geography.longitude === 'N/A' ? resolved.lon : rec.geography.longitude,
                  coordinate_source: `${resolved.source} (${normalized})`
                };
                break;
              }
            }
          }
          return rec;
        });
      }, [files, mappings, lodGeoCache]);

      const previewJsonString = useMemo(() => {
        if (selectedPreviewIdx === 'ALL') {
          return JSON.stringify(transformedRecords, null, 2);
        }
        const idx = Number(selectedPreviewIdx);
        const single = transformedRecords[idx] || transformedRecords[0] || null;
        return JSON.stringify(single ? [single] : [], null, 2);
      }, [transformedRecords, selectedPreviewIdx]);

      const handleCopyJson = () => {
        navigator.clipboard?.writeText(previewJsonString);
        setCopiedJson(true);
        showToast('Copied JSON output to clipboard.');
        setTimeout(() => setCopiedJson(false), 2000);
      };

      const handleDownloadJson = () => {
        if (!isValidForExport) return;
        const blob = new Blob([JSON.stringify(transformedRecords, null, 2)], {
          type: 'application/json'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `epigraphic-transformed-${inputMode.toLowerCase()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded transformed epigraphic JSON.');
      };

      const mappedPathsSet = useMemo(() => {
        const s = new Set();
        Object.values(mappings).forEach((rules) => {
          (rules || []).forEach((r) => s.add(`${r.format}::${r.sourcePath}`));
        });
        return s;
      }, [mappings]);

      const activeInspectedEntry = useMemo(() => {
        if (inspectedRule) {
          const currentRules = mappings[inspectedRule.targetKey] || [];
          const stillExists = currentRules.find((r) => r.id === inspectedRule.rule.id);
          if (stillExists) {
            return { targetKey: inspectedRule.targetKey, rule: stillExists };
          }
        }
        for (const target of TARGET_FIELDS) {
          const rules = mappings[target.key] || [];
          if (rules.length > 0) {
            return { targetKey: target.key, rule: rules[0] };
          }
        }
        return null;
      }, [inspectedRule, mappings]);

      const inspectedSnippetsByFile = useMemo(() => {
        if (!activeInspectedEntry) return [];
        const { rule } = activeInspectedEntry;
        const parser = new DOMParser();

        return files
          .map((file) => {
            if (file.format === 'EpiDoc XML' && rule.format === 'EpiDoc XML') {
              const doc = parser.parseFromString(file.content, 'application/xml');
              const isAttr = rule.sourcePath.includes('/@');
              let elemPath = rule.sourcePath;
              let targetAttr = null;
              if (isAttr) {
                const splitIdx = rule.sourcePath.lastIndexOf('/@');
                elemPath = rule.sourcePath.slice(0, splitIdx);
                targetAttr = rule.sourcePath.slice(splitIdx + 2);
              }

              const allElements = doc.getElementsByTagName('*');
              const matches = [];
              const serializer = new XMLSerializer();

              for (let i = 0; i < allElements.length; i++) {
                const el = allElements[i];
                if (buildSemanticXPath(el) !== elemPath) continue;

                let val = null;
                if (targetAttr) {
                  val = el.getAttribute(targetAttr);
                } else if (rule.textMode === 'raw') {
                  val = el.innerHTML.trim();
                } else if (rule.textMode === 'diplomatic') {
                  val = cleanEpigraphicText(el, 'diplomatic');
                } else {
                  val = cleanEpigraphicText(el, 'interpretive');
                }
                if (!val) continue;

                matches.push({
                  value: String(val),
                  rawSource: serializer.serializeToString(el),
                  uri:
                    el.getAttribute('ref') ||
                    el.getAttribute('corresp') ||
                    el.getAttribute('ana') ||
                    (targetAttr === 'ref' ? val : null),
                  certainty:
                    el.getAttribute('cert') ||
                    el.getAttribute('precision') ||
                    el.getAttribute('evidence') ||
                    null,
                  placeType: !targetAttr ? el.getAttribute('type') || null : null
                });
              }

              return {
                fileName: file.name,
                format: file.format,
                matches
              };
            }

            if (file.format !== 'EpiDoc XML' && rule.format !== 'EpiDoc XML') {
              const matches = evaluateRdfPredicate(file, rule.sourcePath, {
                includeUri: true,
                includeCertainty: true
              }).map((m) => ({
                value: String(m.value),
                rawSource: `${rule.sourcePath} → ${JSON.stringify(m.value)}`,
                uri: m.uri || null,
                certainty: m.certainty || null
              }));

              return {
                fileName: file.name,
                format: file.format,
                matches
              };
            }

            return null;
          })
          .filter(Boolean);

            {/* BOTTOM FULL-WIDTH PANEL: LIVE GENERATED JSON OUTPUT */}
            <section
              className={`bg-[#121927] text-stone-100 rounded-xl border border-slate-800 shadow-sm flex flex-col overflow-hidden min-h-[300px] ${
                activeTabMobile !== 'output' ? 'hidden lg:flex' : 'flex'
              }`}
            >
              <div className="px-4 py-3 bg-[#192336] border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2.5">
                  <Icon name="file-json" className="w-4 h-4 text-emerald-400" />
                  <h2 className="text-xs font-semibold uppercase tracking-wider text-slate-200">
                    Live Generated JSON Output
                  </h2>
                  <span className="text-[11px] text-slate-400 hidden sm:inline">
                    — Preserves LOD <code className="text-sky-300">uri</code>,{' '}
                    <code className="text-purple-300">certainty</code> &amp; LOD-resolved coordinates (
                    {transformedRecords.length} record{transformedRecords.length === 1 ? '' : 's'})
                  </span>
                  {resolvingLodUris && (
                    <span className="text-[11px] text-amber-300 animate-pulse">
                      Resolving LOD coordinates...
                    </span>
                  )}
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <div className="flex items-center gap-1.5 text-xs">
                    <span className="text-slate-400">Preview scope:</span>
                    <select
                      value={selectedPreviewIdx}
                      onChange={(e) => setSelectedPreviewIdx(e.target.value)}
                      className="bg-slate-900 border border-slate-700 text-stone-200 rounded px-2.5 py-1 text-xs focus:outline-none focus:border-sky-500 max-w-[230px]"
                    >
                      <option value="ALL">All Records ({transformedRecords.length} files)</option>
                      {files.map((f, idx) => (
                        <option key={f.id} value={idx}>
                          Record {idx + 1}: {f.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <button
                    onClick={handleCopyJson}
                    className="inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition cursor-pointer"
                  >
                    {copiedJson ? (
                      <>
                        <Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />
                        Copied
                      </>
                    ) : (
                      <>
                        <Icon name="copy" className="w-3.5 h-3.5" />
                        Copy
                      </>
                    )}
                  </button>

                  <button
                    onClick={handleDownloadJson}
                    disabled={!isValidForExport}
                    className={`inline-flex items-center gap-1.5 px-3 py-1 rounded text-xs font-semibold transition ${
                      isValidForExport
                        ? 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer shadow-xs'
                        : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                    }`}
                  >
                    <Icon name="download" className="w-3.5 h-3.5" />
                    Download JSON
                  </button>
                </div>
              </div>

              <div className="flex-1 overflow-auto p-4 font-mono text-[12px] leading-relaxed max-h-[360px]">
                <pre className="text-stone-200 whitespace-pre-wrap break-words">
                  {previewJsonString}
                </pre>
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
