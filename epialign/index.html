      const DISTINGUISHING_ATTRS = ['type', 'subtype', 'decls'];

      const elementXPathCache = new WeakMap();

      function buildSemanticXPath(el) {
        if (!el || el.nodeType !== 1) return '';
        const cached = elementXPathCache.get(el);
        if (cached) return cached;

        const parts = [];
        let curr = el;
        while (curr && curr.nodeType === 1) {
          const localName = curr.localName || curr.nodeName.replace(/^.*:/, '');
          const prefix = curr.namespaceURI && curr.namespaceURI.includes('tei-c.org') ? 'tei:' : '';
          let step = `${prefix}${localName}`;

          const qualifiers = [];
          for (let i = 0; i < DISTINGUISHING_ATTRS.length; i++) {
            const attr = DISTINGUISHING_ATTRS[i];
            if (curr.hasAttribute && curr.hasAttribute(attr)) {
              qualifiers.push(`@${attr}='${curr.getAttribute(attr)}'`);
            }
          }
          if (qualifiers.length > 0) {
            step += `[${qualifiers.join(' and ')}]`;
          }
          parts.unshift(step);
          curr = curr.parentElement;
        }
        const xpath = '//' + parts.join('/');
        elementXPathCache.set(el, xpath);
        return xpath;
      }

      function cleanEpigraphicText(el, editionStyle = 'interpretive') {
        const clone = el.cloneNode(true);
        clone.querySelectorAll('head').forEach((h) => h.remove());

        if (editionStyle === 'diplomatic') {
          clone.querySelectorAll('ex, supplied, corr, reg, note, desc, g').forEach((node) => node.remove());
        } else {
          clone.querySelectorAll('choice').forEach((choice) => {
            if (choice.querySelector('corr')) {

            }
            if (choice.querySelector('reg')) {
              choice.querySelectorAll('orig').forEach((n) => n.remove());
            }
          });
        }

        const lbs = clone.querySelectorAll('lb');
        for (let i = 0; i < lbs.length; i++) {
          const lb = lbs[i];
          const breakAttr = lb.getAttribute('break');
          const replacement = document.createTextNode(breakAttr === 'no' ? '' : i === 0 ? '' : ' ');
          lb.parentNode.replaceChild(replacement, lb);
        }
        const text = (clone.textContent || '')
          .replace(/\s+/g, ' ')
          .trim()
          .replace(/^Text(?:\s*:|\s+(?=[A-Z0-9\[(⟨<]))/i, '')
          .trim();

        return editionStyle === 'diplomatic' ? text.toUpperCase() : text;
      }

      const VALUE_ATTRS = [
        'notBefore-custom',
        'notAfter-custom',
        'notBefore',
        'notAfter',
        'when-custom',
        'when',
        'from',
        'to',
        'value',

      function indexXmlDocument(doc) {
        const pathIndex = new Map();
        const allElements = doc.getElementsByTagName('*');
        for (let i = 0; i < allElements.length; i++) {
          const el = allElements[i];
          const path = buildSemanticXPath(el);
          let bucket = pathIndex.get(path);
          if (!bucket) {
            bucket = [];
            pathIndex.set(path, bucket);
          }
          bucket.push(el);
        }
        return pathIndex;
      }

      function extractXmlFieldsFromDoc(doc) {

        const allElements = doc.getElementsByTagName('*');

        for (let i = 0; i < allElements.length; i++) {
          const el = allElements[i];
          const basePath = buildSemanticXPath(el);

          const localName = el.localName || el.nodeName;
          const isEditionContainer =
            (localName === 'div' &&
              (el.getAttribute('type') === 'edition' || el.getAttribute('type') === 'diplomatic')) ||
            localName === 'ab';
          let hasChildElements = false;
          for (let c = 0; c < el.childNodes.length; c++) {
            if (el.childNodes[c].nodeType === 1) {
              hasChildElements = true;

          if (!hasChildElements || isEditionContainer || localName === 'expan') {

                el.getAttribute('ref') || el.getAttribute('corresp') || el.getAttribute('ana') || null;
              const certVal =

              if (entry.samples.length < 3 && !entry.samples.includes(attrVal)) {

                entry.hasCertainty = true;
                if (!entry.sampleCertainty) entry.sampleCertainty = certVal;

      function parseTurtleSimple(ttlText) {
        const prefixes = {};
        const lines = ttlText.split(/\r?\n/);
        const bodyLines = [];

        for (let i = 0; i < lines.length; i++) {
          const trimmed = lines[i].trim();
          if (!trimmed || trimmed.startsWith('#')) continue;
          const prefixMatch = trimmed.match(/^@?prefix\s+([a-zA-Z0-9_-]*:)\s*<([^>]+)>\s*\.?$/i);
          if (prefixMatch) {
            prefixes[prefixMatch[1]] = prefixMatch[2];
          } else {
            bodyLines.push(lines[i]);
          }
        }

        const record = { '@id': null, _triples: {} };
        const joined = bodyLines.join('\n').trim();

        const blocks = [];
        let current = '';
        let inQuotes = false;
        let inTripleQuotes = false;
        let inAngle = false;

        for (let i = 0; i < joined.length; i++) {
          const ch = joined[i];
          const nextThree = joined.slice(i, i + 3);
          if (!inAngle && nextThree === '"""') {
            inTripleQuotes = !inTripleQuotes;
            current += '"""';
            i += 2;
            continue;
          }
          if (!inTripleQuotes && !inAngle && ch === '"' && joined[i - 1] !== '\\') {
            inQuotes = !inQuotes;
          } else if (!inTripleQuotes && !inQuotes && ch === '<') {
            inAngle = true;
          } else if (!inTripleQuotes && !inQuotes && ch === '>') {
            inAngle = false;
          }

          if (!inQuotes && !inTripleQuotes && !inAngle && ch === '.') {
            if (current.trim()) blocks.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        if (current.trim()) blocks.push(current.trim());

        const parseObjectTerm = (rawTerm) => {
          const objRaw = rawTerm.trim();
          let value = objRaw;
          let uri = null;

          if (objRaw.startsWith('<') && objRaw.endsWith('>')) {
            uri = objRaw.slice(1, -1);
            const slug = uri.split('/').filter(Boolean).pop() || uri;
            value = decodeURIComponent(slug).replace(/___/g, ' / ').replace(/_/g, ' ');
          } else if (objRaw.startsWith('"""')) {
            const endIdx = objRaw.indexOf('"""', 3);
            if (endIdx !== -1) {
              value = objRaw.slice(3, endIdx).replace(/\s+/g, ' ').trim();
            }
          } else if (objRaw.startsWith('"')) {
            const litMatch = objRaw.match(/^"((?:[^"\\]|\\.)*)"/);
            if (litMatch) value = litMatch[1].replace(/\s+/g, ' ').trim();
          } else if (/^[a-zA-Z0-9_-]+:[^\s]+$/.test(objRaw)) {
            const [pfx, local] = objRaw.split(':');
            if (prefixes[`${pfx}:`]) {
              uri = `${prefixes[`${pfx}:`]}${local}`;
            }
            value = local;
          }
          return { value, uri };
        };

        blocks.forEach((block, blockIdx) => {
          const subjMatch = block.match(/^(<[^>]+>|[a-zA-Z0-9_-]+:[^\s;]+)\s+([\s\S]+)$/);
          if (!subjMatch) return;
          let subjRaw = subjMatch[1];
          if (subjRaw.startsWith('<') && subjRaw.endsWith('>')) {
            subjRaw = subjRaw.slice(1, -1);
          } else if (subjRaw.includes(':')) {
            const [pfx, local] = subjRaw.split(':');
            if (prefixes[`${pfx}:`]) subjRaw = `${prefixes[`${pfx}:`]}${local}`;
          }
          if (blockIdx === 0 && !record['@id']) {
            record['@id'] = subjRaw;
          }

          const rest = subjMatch[2];
          const statements = [];
          let stmtBuf = '';
          let q = false;
          let tq = false;
          let ang = false;
          for (let i = 0; i < rest.length; i++) {
            const ch = rest[i];
            if (!ang && rest.slice(i, i + 3) === '"""') {
              tq = !tq;
              stmtBuf += '"""';
              i += 2;
              continue;
            }
            if (!tq && !ang && ch === '"' && rest[i - 1] !== '\\') q = !q;
            else if (!tq && !q && ch === '<') ang = true;
            else if (!tq && !q && ch === '>') ang = false;

            if (!q && !tq && !ang && ch === ';') {
              if (stmtBuf.trim()) statements.push(stmtBuf.trim());
              stmtBuf = '';
            } else {
              stmtBuf += ch;
            }
          }
          if (stmtBuf.trim()) statements.push(stmtBuf.trim());

          for (const stmt of statements) {
            const parts = stmt.trim().match(/^([^\s]+)\s+([\s\S]+)$/);
            if (!parts) continue;
            let pred = parts[1];
            const objListRaw = parts[2].trim();
            if (pred === 'a') pred = 'rdf:type';

            const objItems = [];
            let oBuf = '';
            let oq = false;
            let otq = false;
            let oang = false;
            for (let i = 0; i < objListRaw.length; i++) {
              const ch = objListRaw[i];
              if (!oang && objListRaw.slice(i, i + 3) === '"""') {
                otq = !otq;
                oBuf += '"""';
                i += 2;
                continue;
              }
              if (!otq && !oang && ch === '"' && objListRaw[i - 1] !== '\\') oq = !oq;
              else if (!otq && !oq && ch === '<') oang = true;
              else if (!otq && !oq && ch === '>') oang = false;

              if (!oq && !otq && !oang && ch === ',') {
                if (oBuf.trim()) objItems.push(oBuf.trim());
                oBuf = '';
              } else {
                oBuf += ch;
              }
            }
            if (oBuf.trim()) objItems.push(oBuf.trim());

            if (!record._triples[pred]) record._triples[pred] = [];
            for (const oItem of objItems) {
              record._triples[pred].push(parseObjectTerm(oItem));
            }
          }
        });

        return record;
      }

      const parsedArtifactCache = new WeakMap();

      function getParsedFileArtifact(file) {
        if (parsedArtifactCache.has(file)) {
          return parsedArtifactCache.get(file);
        }
        let artifact = null;
        if (file.format === 'EpiDoc XML') {
          const parser = new DOMParser();
          const doc = parser.parseFromString(file.content, 'application/xml');
          const hasError = Boolean(doc.querySelector('parsererror'));
          artifact = {
            kind: 'XML',
            doc: hasError ? null : doc,
            pathIndex: hasError ? new Map() : indexXmlDocument(doc),
            discoveredFields: hasError ? [] : extractXmlFieldsFromDoc(doc)
          };
        } else if (file.format.includes('JSON-LD')) {
          let json = null;
          try {
            json = JSON.parse(file.content);
          } catch (e) {
            json = null;
          }
          artifact = {
            kind: 'JSON-LD',
            json,
            discoveredFields: json ? extractRdfFieldsFromParsed(file, json, null) : []
          };
        } else {
          const turtle = parseTurtleSimple(file.content);
          artifact = {
            kind: 'TURTLE',
            turtle,
            discoveredFields: extractRdfFieldsFromParsed(file, null, turtle)
          };
        }
        parsedArtifactCache.set(file, artifact);
        return artifact;
      }

      function extractRdfFieldsFromParsed(file, jsonData, turtleData) {
        const fieldsMap = new Map();

        const registerField = (pred, sampleVal, uri, certainty) => {
          let entry = fieldsMap.get(pred);
          if (!entry) {
            entry = {
              path: pred,
              format: file.format,
              count: 0,
              samples: [],
              hasUri: false,
              hasCertainty: false,
              sampleUri: null,
              sampleCertainty: null
            };
            fieldsMap.set(pred, entry);
          }
          entry.count += 1;
          const strVal = String(sampleVal);
          if (entry.samples.length < 3 && !entry.samples.includes(strVal)) {
            entry.samples.push(strVal);
          }
          if (uri) {
            entry.hasUri = true;
            if (!entry.sampleUri) entry.sampleUri = uri;
          }
          if (certainty) {
            entry.hasCertainty = true;
            if (!entry.sampleCertainty) entry.sampleCertainty = certainty;
          }
        };

        if (jsonData) {
          const graphs = Array.isArray(jsonData['@graph']) ? jsonData['@graph'] : [jsonData];
          const walkObject = (obj, prefix = '') => {
            if (!obj || typeof obj !== 'object') return;
            const localCert = obj['epont:certainty'] || obj['certainty'] || null;
            const localId = obj['@id'] || obj['owl:sameAs'] || null;

            for (const [key, val] of Object.entries(obj)) {
              if (key === '@context' || key === '@type') continue;
              const fullPred = prefix ? `${prefix} → ${key}` : key;

              if (key === '@id' && !prefix) {
                registerField('@id', val, val, null);
                continue;
              }

              const items = Array.isArray(val) ? val : [val];
              for (const item of items) {
                if (item && typeof item === 'object') {
                  const label =
                    item['skos:prefLabel'] ||
                    item['@value'] ||
                    item['rdfs:label'] ||
                    item['@id'] ||
                    null;
                  const itemUri = item['@id'] || item['owl:sameAs'] || localId;
                  const itemCert = item['epont:certainty'] || localCert;
                  if (label) {
                    registerField(fullPred, label, itemUri, itemCert);
                  }
                  walkObject(item, fullPred);
                } else if (item !== null && item !== undefined) {
                  registerField(fullPred, item, localId, localCert);
                }
              }
            }
          };
          graphs.forEach((g) => walkObject(g));
        } else if (turtleData) {
          if (turtleData['@id']) {
            registerField('@id (Subject URI)', turtleData['@id'], turtleData['@id'], null);
          }
          const globalCert = turtleData._triples['epont:certainty']?.[0]?.value || null;
          for (const [pred, entries] of Object.entries(turtleData._triples)) {
            for (const ent of entries) {
              registerField(pred, ent.value, ent.uri, globalCert);
            }
          }
        }

        return Array.from(fieldsMap.values());
      }

      // ============================================================================
      // 4. TRANSFORMATION ENGINE (Cached Artifacts + Alignments -> Target JSON)
      // ============================================================================

      function evaluateXmlXPathIndexed(pathIndex, xpathExpr, options) {
        const isAttr = xpathExpr.includes('/@');
        let elemPath = xpathExpr;
        let targetAttr = null;

        if (isAttr) {
          const splitIdx = xpathExpr.lastIndexOf('/@');
          elemPath = xpathExpr.slice(0, splitIdx);
          targetAttr = xpathExpr.slice(splitIdx + 2);
        }

        const matchedElements = pathIndex.get(elemPath) || [];
        const results = [];

        for (let i = 0; i < matchedElements.length; i++) {
          const el = matchedElements[i];

          let rawValue = null;
          if (targetAttr) {
            rawValue = el.getAttribute(targetAttr);
          } else if (options.textMode === 'raw') {
            rawValue = el.innerHTML.trim();
          } else if (options.textMode === 'diplomatic') {
            rawValue = cleanEpigraphicText(el, 'diplomatic');
          } else {
            rawValue = cleanEpigraphicText(el, 'interpretive');
          }

          if (!rawValue) continue;

          const uri =
            el.getAttribute('ref') ||
            el.getAttribute('corresp') ||
            el.getAttribute('ana') ||
            (targetAttr === 'ref' ? rawValue : null);
          const certainty =
            el.getAttribute('cert') ||
            el.getAttribute('precision') ||
            el.getAttribute('evidence') ||
            null;
          const placeType = !targetAttr ? el.getAttribute('type') || null : null;

          const item = { value: rawValue };
          if (placeType) item.type = placeType;
          if (options.includeUri && uri) item.uri = uri;
          if (options.includeCertainty && certainty) item.certainty = certainty;
          results.push(item);
        }

        return results;
      }

      function evaluateRdfPredicateCached(artifact, predPath, options) {
        const results = [];

        if (artifact.kind === 'JSON-LD' && artifact.json) {
          const graphs = Array.isArray(artifact.json['@graph'])
            ? artifact.json['@graph']
            : [artifact.json];

          const searchNode = (obj, prefix = '') => {
            if (!obj || typeof obj !== 'object') return;
            const localCert = obj['epont:certainty'] || obj['certainty'] || null;
            const localId = obj['@id'] || obj['owl:sameAs'] || null;

            for (const [key, val] of Object.entries(obj)) {
              if (key === '@context' || key === '@type') continue;
              const fullPred = prefix ? `${prefix} → ${key}` : key;
              const items = Array.isArray(val) ? val : [val];

              if (fullPred === predPath) {
                for (const item of items) {
                  if (item && typeof item === 'object') {
                    const label =
                      item['skos:prefLabel'] ||
                      item['@value'] ||
                      item['rdfs:label'] ||
                      item['@id'];
                    const uri = item['@id'] || item['owl:sameAs'] || localId;
                    const cert = item['epont:certainty'] || localCert;
                    if (label !== undefined && label !== null) {
                      const resObj = { value: label };
                      if (options.includeUri && uri) resObj.uri = uri;
                      if (options.includeCertainty && cert) resObj.certainty = cert;
                      results.push(resObj);
                    }
                  } else if (item !== null && item !== undefined) {
                    const resObj = { value: item };
                    if (options.includeUri && localId) resObj.uri = localId;
                    if (options.includeCertainty && localCert) resObj.certainty = localCert;
                    results.push(resObj);
                  }
                }
              }

              for (const item of items) {
                if (item && typeof item === 'object') {
                  searchNode(item, fullPred);
                }
              }
            }
          };

          graphs.forEach((g) => searchNode(g));
        } else if (artifact.kind === 'TURTLE' && artifact.turtle) {
          const parsed = artifact.turtle;
          const globalCert = parsed._triples['epont:certainty']?.[0]?.value || null;
          if (predPath === '@id (Subject URI)' && parsed['@id']) {
            const resObj = { value: parsed['@id'] };
            if (options.includeUri) resObj.uri = parsed['@id'];
            results.push(resObj);
          } else if (parsed._triples[predPath]) {
            for (const ent of parsed._triples[predPath]) {
              const resObj = { value: ent.value };
              if (options.includeUri && ent.uri) resObj.uri = ent.uri;
              if (options.includeCertainty && globalCert) resObj.certainty = globalCert;
              results.push(resObj);
            }
          }
        }

        return results;
      }

      function transformFileToTargetJson(file, mappings) {
        const artifact = getParsedFileArtifact(file);

        const extractForTarget = (targetKey) => {
          const rules = mappings[targetKey] || [];
          const collected = [];

          for (let i = 0; i < rules.length; i++) {
            const rule = rules[i];
            if (artifact.kind === 'XML' && artifact.pathIndex) {
              const matches = evaluateXmlXPathIndexed(artifact.pathIndex, rule.sourcePath, rule);
              collected.push(...matches);
            } else if (artifact.kind !== 'XML') {
              const matches = evaluateRdfPredicateCached(artifact, rule.sourcePath, rule);
              collected.push(...matches);
            }
          }
          return collected;
        };

        const formatSingleOrArray = (items, allowArray, isText = false, isNumeric = false) => {
          if (!items || items.length === 0) return 'N/A';
          if (isText) {
            return items[0].value;
          }
          if (isNumeric) {
            const first = { ...items[0] };
            const str = String(first.value).trim();
            if (/^[+-]?\d+(\.\d+)?$/.test(str)) {
              first.value = Number(str);
            } else {
              const isoYearMatch = str.match(/^([+-]?\d{1,4})-\d{2}-\d{2}$/);
              if (isoYearMatch) {
                first.value = Number(isoYearMatch[1]);
              }
            }
            return allowArray ? [first] : first;
          }
          if (!allowArray) {
            return items[0];
          }
          return items;
        };

        const provinceItems = extractForTarget('geography_province');
        const placeItems = extractForTarget('geography_ancient_place_name');
        const latItems = extractForTarget('geography_latitude');
        const lonItems = extractForTarget('geography_longitude');

        let parsedLat = null;
        let parsedLon = null;

        if (latItems.length > 0) {
          const rawLat = String(latItems[0].value).trim();
          if (rawLat.includes(',') || rawLat.includes(' ')) {
            const parts = rawLat.split(/[\s,]+/).filter(Boolean);
            parsedLat = parseFloat(parts[0]);
            if (lonItems.length === 0 && parts[1]) {
              parsedLon = parseFloat(parts[1]);
            }
          } else {
            parsedLat = isNaN(parseFloat(rawLat)) ? rawLat : parseFloat(rawLat);
          }
        }

        if (lonItems.length > 0) {
          const rawLon = String(lonItems[0].value).trim();
          if (rawLon.includes(',') || rawLon.includes(' ')) {
            const parts = rawLon.split(/[\s,]+/).filter(Boolean);
            parsedLon = parseFloat(parts[1] || parts[0]);
          } else {
            parsedLon = isNaN(parseFloat(rawLon)) ? rawLon : parseFloat(rawLon);
          }
        }

        const formattedProvinces = provinceItems.map((p) => {
          const obj = { value: p.value };
          if (p.type) obj.type = p.type;
          if (p.uri) obj.uri = p.uri;
          if (p.certainty) obj.certainty = p.certainty;
          return obj;
        });

        const formattedAncientPlaces = placeItems.map((p) => {
          const obj = { value: p.value };
          if (p.type) obj.type = p.type;
          if (p.uri) obj.uri = p.uri;
          if (p.certainty) obj.certainty = p.certainty;
          return obj;
        });

        const hasGeoData =
          formattedProvinces.length > 0 ||
          formattedAncientPlaces.length > 0 ||
          (parsedLat !== null && !Number.isNaN(parsedLat)) ||
          (parsedLon !== null && !Number.isNaN(parsedLon));

        const geographyOutput = hasGeoData
          ? {
              province: formattedProvinces.length > 0 ? formattedProvinces : 'N/A',
              ancient_place_name: formattedAncientPlaces.length > 0 ? formattedAncientPlaces : 'N/A',
              latitude: parsedLat !== null && !Number.isNaN(parsedLat) ? parsedLat : 'N/A',
              longitude: parsedLon !== null && !Number.isNaN(parsedLon) ? parsedLon : 'N/A'
            }
          : 'N/A';

        return {
          _source_file: file.name,
          _source_format: file.format,
          id: formatSingleOrArray(extractForTarget('id'), false),
          provenance_corpus: formatSingleOrArray(extractForTarget('provenance_corpus'), true),
          interpretive_text: formatSingleOrArray(extractForTarget('interpretive_text'), false, true),
          diplomatic_text: formatSingleOrArray(extractForTarget('diplomatic_text'), false, true),
          start_date: formatSingleOrArray(extractForTarget('start_date'), false, false, true),
          end_date: formatSingleOrArray(extractForTarget('end_date'), false, false, true),
          material: formatSingleOrArray(extractForTarget('material'), true),
          type_of_object: formatSingleOrArray(extractForTarget('type_of_object'), true),
          type_of_inscription: formatSingleOrArray(extractForTarget('type_of_inscription'), true),
          geography: geographyOutput
        };
      }

      function App() {
        const [darkMode, setDarkMode] = useState(() => {
          try {
            const saved = localStorage.getItem('epialign-theme');
            if (saved === 'dark') return true;
            if (saved === 'light') return false;
          } catch (e) {}
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        });

        useEffect(() => {
          const rootEl = document.documentElement;
          if (darkMode) {
            rootEl.classList.add('dark');
          } else {
            rootEl.classList.remove('dark');
          }
          try {
            localStorage.setItem('epialign-theme', darkMode ? 'dark' : 'light');
          } catch (e) {}
        }, [darkMode]);

        const [inputMode, setInputMode] = useState('XML');

        const [filesByMode, setFilesByMode] = useState({
          XML: [],
          RDF: []
        });

        const [mappingsByMode, setMappingsByMode] = useState({
          XML: {},
          RDF: {}
        });

        const files = filesByMode[inputMode] || [];
        const mappings = mappingsByMode[inputMode] || {};

        const [lodGeoCache, setLodGeoCache] = useState({
          'https://pleiades.stoa.org/places/118569': { lat: 45.7697, lon: 13.3708, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/462410': { lat: 38.13205, lon: 13.33561, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/79574': { lat: 51.513335, lon: -0.088949, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/423025': { lat: 41.89193, lon: 12.51133, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/89105': { lat: 55.0033, lon: -1.4317, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/89132': { lat: 52.5, lon: -1.5, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/462503': { lat: 37.0755, lon: 15.2866, source: 'Pleiades LOD' },
          'https://pleiades.stoa.org/places/462492': { lat: 37.5, lon: 14.0, source: 'Pleiades LOD' }
        });
        const [resolvingLodUris, setResolvingLodUris] = useState(false);
        const inFlightLodUrisRef = useRef(new Set());

        const [batchIngestState, setBatchIngestState] = useState(null);
        const [isDragOverDropzone, setIsDragOverDropzone] = useState(false);
        const [isExportingZip, setIsExportingZip] = useState(false);
        const [fileListFilter, setFileListFilter] = useState('');
        const [visibleFileLimit, setVisibleFileLimit] = useState(50);

        const [fieldSearch, setFieldSearch] = useState('');
        const [draggedField, setDraggedField] = useState(null);
        const [dragOverTarget, setDragOverTarget] = useState(null);
        const [openDropdownTarget, setOpenDropdownTarget] = useState(null);
        const [dropdownSearch, setDropdownSearch] = useState('');
        const [selectedPreviewIdx, setSelectedPreviewIdx] = useState('ALL');
        const [inspectedRule, setInspectedRule] = useState(null);
        const [copiedJson, setCopiedJson] = useState(false);
        const [toastMessage, setToastMessage] = useState(null);
        const [uploadError, setUploadError] = useState(null);
        const [activeTabMobile, setActiveTabMobile] = useState('workspace');
        const [verifierViewMode, setVerifierViewMode] = useState('split');
        const [selectedVerifierFile, setSelectedVerifierFile] = useState('ALL');

        const fileInputRef = useRef(null);
        const folderInputRef = useRef(null);
        const profileInputRef = useRef(null);

        const showToast = useCallback((msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(null), 3400);
        }, []);

        useEffect(() => {
          if (!openDropdownTarget) return;
          const onKeyDown = (e) => {
            if (e.key === 'Escape') {
              setOpenDropdownTarget(null);
              setDropdownSearch('');
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [openDropdownTarget]);

        const discoveredFields = useMemo(() => {
          const combined = new Map();

          for (let fIdx = 0; fIdx < files.length; fIdx++) {
            const file = files[fIdx];
            if (inputMode === 'XML' && file.format !== 'EpiDoc XML') continue;
            if (inputMode === 'RDF' && file.format === 'EpiDoc XML') continue;

            const artifact = getParsedFileArtifact(file);
            const extracted = artifact.discoveredFields || [];

            for (let i = 0; i < extracted.length; i++) {
              const item = extracted[i];
              const key = `${item.format}::${item.path}`;
              const existing = combined.get(key);
              if (!existing) {
                combined.set(key, {
                  ...item,
                  samples: [...item.samples],
                  key,
                  files: [file.name]
                });
              } else {
                existing.count += item.count;
                if (existing.files.length < 15 && !existing.files.includes(file.name)) {
                  existing.files.push(file.name);
                }
                for (let s = 0; s < item.samples.length; s++) {
                  const sample = item.samples[s];
                  if (existing.samples.length < 3 && !existing.samples.includes(sample)) {
                    existing.samples.push(sample);
                  }
                }
                existing.hasUri = existing.hasUri || item.hasUri;
                existing.hasCertainty = existing.hasCertainty || item.hasCertainty;
              }
            }
          }

          return Array.from(combined.values());
        }, [files, inputMode]);

        const discoveredFieldLookup = useMemo(() => {
          const map = new Map();
          discoveredFields.forEach((f) => {
            map.set(`${f.format}::${f.path}`, f);
          });
          return map;
        }, [discoveredFields]);

        const filteredDiscoveredFields = useMemo(() => {
          const q = fieldSearch.toLowerCase().trim();
          if (!q) return discoveredFields;
          return discoveredFields.filter(
            (f) =>
              f.path.toLowerCase().includes(q) ||
              f.samples.some((s) => s.toLowerCase().includes(q))
          );
        }, [discoveredFields, fieldSearch]);

        const filteredLoadedFiles = useMemo(() => {
          const q = fileListFilter.toLowerCase().trim();
          if (!q) return files;
          return files.filter(
            (f) =>
              f.name.toLowerCase().includes(q) ||
              (f.description && f.description.toLowerCase().includes(q))
          );
        }, [files, fileListFilter]);

        const buildSuggestedMappingsForFields = (fieldsList) => {
          const nextMappings = {};
          for (const target of TARGET_FIELDS) {
            const candidatePaths = AUTO_SUGGEST_RULES[target.key] || [];
            const matchedRules = [];
            for (const cand of candidatePaths) {
              const found = fieldsList.find((df) => df.path === cand);
              if (found) {
                matchedRules.push({
                  id: `${target.key}-${found.path}-${Math.random().toString(36).slice(2, 7)}`,
                  sourcePath: found.path,
                  format: found.format,
                  includeUri: true,
                  includeCertainty: true,
                  textMode: target.key === 'diplomatic_text' ? 'diplomatic' : 'clean'
                });
              }
            }
            if (matchedRules.length > 0) {
              nextMappings[target.key] = matchedRules;
            }
          }
          return nextMappings;
        };

        const handleModeSwitch = (nextMode) => {
          if (nextMode === inputMode) return;
          setInputMode(nextMode);
          setSelectedPreviewIdx('ALL');
          setSelectedVerifierFile('ALL');
          setInspectedRule(null);
          setFieldSearch('');
          setFileListFilter('');
          setOpenDropdownTarget(null);
          setUploadError(null);
          showToast(
            `Switched to ${
              nextMode === 'XML' ? 'EpiDoc XML (.xml)' : 'RDF (JSON-LD / Turtle)'
            } workflow.`
          );
        };

        const applyAutoSuggest = (notify = true) => {
          const suggested = buildSuggestedMappingsForFields(discoveredFields);
          setMappingsByMode((prev) => ({
            ...prev,
            [inputMode]: suggested
          }));
          const firstKey = Object.keys(suggested)[0];
          if (firstKey && suggested[firstKey]?.[0]) {
            setInspectedRule({ targetKey: firstKey, rule: suggested[firstKey][0] });
          }
          if (notify) {
            showToast(
              `Auto-aligned standard ${
                inputMode === 'XML' ? 'EpiDoc TEI XPaths' : 'RDF predicates'
              } to target attributes.`
            );
          }
        };

        const addMappingRule = (targetKey, fieldObj) => {
          const newRule = {
            id: `${targetKey}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            sourcePath: fieldObj.path,
            format: fieldObj.format,
            includeUri: true,
            includeCertainty: true,
            textMode: targetKey === 'diplomatic_text' ? 'diplomatic' : 'clean'
          };

          setMappingsByMode((prev) => {
            const modeMappings = prev[inputMode] || {};
            const current = modeMappings[targetKey] || [];
            if (current.some((r) => r.sourcePath === fieldObj.path && r.format === fieldObj.format)) {
              showToast('This input path is already aligned to this target field.');
              return prev;
            }
            return {
              ...prev,
              [inputMode]: {
                ...modeMappings,
                [targetKey]: [...current, newRule]
              }
            };
          });
          setInspectedRule({ targetKey, rule: newRule });
          setOpenDropdownTarget(null);
          setDropdownSearch('');
        };

        const removeMappingRule = (targetKey, ruleId) => {
          setMappingsByMode((prev) => {
            const modeMappings = prev[inputMode] || {};
            const updated = (modeMappings[targetKey] || []).filter((r) => r.id !== ruleId);
            const nextModeMappings = { ...modeMappings };
            if (updated.length === 0) {
              delete nextModeMappings[targetKey];
            } else {
              nextModeMappings[targetKey] = updated;
            }
            return {
              ...prev,
              [inputMode]: nextModeMappings
            };
          });
          setInspectedRule((prev) => (prev?.rule?.id === ruleId ? null : prev));
        };

        const updateRuleOption = (targetKey, ruleId, patch) => {
          setMappingsByMode((prev) => {
            const modeMappings = prev[inputMode] || {};
            return {
              ...prev,
              [inputMode]: {
                ...modeMappings,
                [targetKey]: (modeMappings[targetKey] || []).map((r) =>
                  r.id === ruleId ? { ...r, ...patch } : r
                )
              }
            };
          });
          setInspectedRule((prev) =>
            prev?.rule?.id === ruleId
              ? { ...prev, rule: { ...prev.rule, ...patch } }
              : prev
          );
        };

        const processBatchFiles = async (rawFileList) => {
          const allFiles = Array.from(rawFileList || []);
          if (allFiles.length === 0) return;
          setUploadError(null);

          const validFiles = [];
          const rejectedNames = [];

          for (let i = 0; i < allFiles.length; i++) {
            const file = allFiles[i];
            const lower = file.name.toLowerCase();
            if (file.name.startsWith('.')) continue;

            const isXmlExt = lower.endsWith('.xml');
            const isRdfExt =
              lower.endsWith('.jsonld') ||
              lower.endsWith('.ttl') ||
              lower.endsWith('.rdf') ||
              lower.endsWith('.json');

            if (inputMode === 'XML' && isXmlExt) {
              validFiles.push(file);
            } else if (inputMode === 'RDF' && isRdfExt) {
              validFiles.push(file);
            } else {
              rejectedNames.push(file.name);
            }
          }

          if (rejectedNames.length > 0) {
            const previewRejected = rejectedNames.slice(0, 3).join(', ');
            const extraCount = rejectedNames.length > 3 ? ` (+${rejectedNames.length - 3} more)` : '';
            setUploadError(
              `Skipped ${rejectedNames.length} incompatible file${rejectedNames.length === 1 ? '' : 's'} (${previewRejected}${extraCount}). ${
                inputMode === 'XML'
                  ? 'EpiDoc XML mode accepts .xml files.'
                  : 'RDF mode accepts .jsonld, .ttl, or .rdf files.'
              }`
            );
          }

          if (validFiles.length === 0) return;

          setBatchIngestState({ processed: 0, total: validFiles.length });
          const CHUNK_SIZE = 25;
          const ingestedRecords = [];

          for (let start = 0; start < validFiles.length; start += CHUNK_SIZE) {
            const chunk = validFiles.slice(start, start + CHUNK_SIZE);
            const chunkResults = await Promise.all(
              chunk.map(async (file) => {
                const content = await file.text();
                const lower = file.name.toLowerCase();
                let format = 'EpiDoc XML';
                if (inputMode === 'RDF') {
                  if (lower.endsWith('.jsonld') || lower.endsWith('.json')) {
                    format = 'RDF (JSON-LD)';
                  } else if (lower.endsWith('.ttl')) {
                    format = 'RDF (Turtle)';
                  } else {
                    format = 'RDF (RDF-XML)';
                  }
                }
                const relPath = file.webkitRelativePath || file.name;
                const fileObj = {
                  id: `upload-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                  name: file.name,
                  format,
                  description:
                    relPath !== file.name
                      ? `Folder batch: ${relPath}`
                      : `Batch dataset (${(file.size / 1024).toFixed(1)} KB)`,
                  content
                };
                getParsedFileArtifact(fileObj);
                return fileObj;
              })
            );

            ingestedRecords.push(...chunkResults);
            setBatchIngestState({
              processed: Math.min(start + CHUNK_SIZE, validFiles.length),
              total: validFiles.length
            });
            await new Promise((r) => setTimeout(r, 0));
          }

          setFilesByMode((prev) => ({
            ...prev,
            [inputMode]: [...(prev[inputMode] || []), ...ingestedRecords]
          }));
          setBatchIngestState(null);
          showToast(
            `Batch imported ${ingestedRecords.length} ${inputMode} file${
              ingestedRecords.length === 1 ? '' : 's'
            }.`
          );
        };

        const handleFileUpload = (e) => {
          processBatchFiles(e.target.files);
          e.target.value = '';
        };

        const handleDropFiles = async (e) => {
          e.preventDefault();
          setIsDragOverDropzone(false);

          const items = e.dataTransfer?.items;
          if (items && items.length > 0 && items[0].webkitGetAsEntry) {
            const collectedFiles = [];
            const traverseEntry = async (entry) => {
              if (!entry) return;
              if (entry.isFile) {
                const file = await new Promise((resolve) => entry.file(resolve));
                if (file) collectedFiles.push(file);
              } else if (entry.isDirectory) {
                const reader = entry.createReader();
                const entries = await new Promise((resolve) => {
                  const all = [];
                  const readBatch = () => {
                    reader.readEntries((batch) => {
                      if (!batch.length) resolve(all);
                      else {
                        all.push(...batch);
                        readBatch();
                      }
                    });
                  };
                  readBatch();
                });
                for (const child of entries) {
                  await traverseEntry(child);
                }
              }
            };

            for (let i = 0; i < items.length; i++) {
              const entry = items[i].webkitGetAsEntry();
              if (entry) await traverseEntry(entry);
            }
            if (collectedFiles.length > 0) {
              processBatchFiles(collectedFiles);
              return;
            }
          }

          if (e.dataTransfer?.files?.length) {
            processBatchFiles(e.dataTransfer.files);
          }
        };

        const removeFile = (fileId) => {
          setFilesByMode((prev) => ({
            ...prev,
            [inputMode]: (prev[inputMode] || []).filter((f) => f.id !== fileId)
          }));
          setSelectedPreviewIdx('ALL');
        };

        const clearAllFiles = () => {
          setFilesByMode((prev) => ({
            ...prev,
            [inputMode]: []
          }));
          setSelectedPreviewIdx('ALL');
          setSelectedVerifierFile('ALL');
          showToast(`Cleared all loaded ${inputMode} files.`);
        };

        const loadTestDatasets = () => {
          setUploadError(null);
          const sampleSubset = SAMPLE_FILES.filter((f) =>
            inputMode === 'XML' ? f.format === 'EpiDoc XML' : f.format !== 'EpiDoc XML'
          );
          setFilesByMode((prev) => ({
            ...prev,
            [inputMode]: sampleSubset
          }));
          setSelectedPreviewIdx('ALL');
          showToast(
            `Loaded authentic ${
              inputMode === 'XML' ? 'EDH & I.Sicily EpiDoc XML' : 'EDH & RIB Turtle RDF'
            } test datasets.`
          );
        };

        const handleExportProfile = () => {
          const profile = {
            schema_version: '1.1',
            input_format: inputMode === 'XML' ? 'EpiDoc XML' : 'RDF',
            exported_at: new Date().toISOString(),
            description: `Epigraphic Data (${
              inputMode === 'XML' ? 'EpiDoc XML' : 'RDF'
            }) to JSON Field Alignment Profile`,
            mappings
          };
          const blob = new Blob([JSON.stringify(profile, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `epigraphic-${inputMode.toLowerCase()}-alignment-profile.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast(`Exported ${inputMode} alignment profile (.json).`);
        };

        const handleImportProfile = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target?.result);
              if (parsed && parsed.mappings && typeof parsed.mappings === 'object') {
                const profileMode =
                  parsed.input_format === 'RDF'
                    ? 'RDF'
                    : parsed.input_format === 'EpiDoc XML'
                    ? 'XML'
                    : inputMode;
                setInputMode(profileMode);
                setMappingsByMode((prev) => ({
                  ...prev,
                  [profileMode]: parsed.mappings
                }));
                showToast(`Imported ${profileMode} alignment profile from ${file.name}`);
              } else {
                showToast('Invalid profile JSON: missing "mappings" object.');
              }
            } catch (err) {
              showToast('Could not parse profile JSON file.');
            }
          };
          reader.readAsText(file);
          e.target.value = '';
        };

        const mandatoryFields = TARGET_FIELDS.filter((f) => f.group === 'mandatory');
        const unmappedMandatory = mandatoryFields.filter(
          (f) => !mappings[f.key] || mappings[f.key].length === 0
        );
        const isValidForExport = unmappedMandatory.length === 0 && files.length > 0;
        const currentWorkflowStep = files.length === 0 ? 2 : !isValidForExport ? 3 : 4;

        useEffect(() => {
          const candidateUris = new Set();
          files.forEach((file) => {
            const baseRec = transformFileToTargetJson(file, mappings);
            if (baseRec.geography && typeof baseRec.geography === 'object') {
              const places = Array.isArray(baseRec.geography.ancient_place_name)
                ? baseRec.geography.ancient_place_name
                : [];
              const provinces = Array.isArray(baseRec.geography.province)
                ? baseRec.geography.province
                : [];
              [...places, ...provinces].forEach((entry) => {
                if (entry && entry.uri) {
                  const normalized = entry.uri.replace(/^http:\/\//i, 'https://').replace(/\/$/, '');
                  const alreadyCached = normalized in lodGeoCache || entry.uri in lodGeoCache;
                  const alreadyRequested = inFlightLodUrisRef.current.has(normalized);
                  if (!alreadyCached && !alreadyRequested) {
                    candidateUris.add(normalized);
                  }
                }
              });
            }
          });

          if (candidateUris.size === 0) return;

          candidateUris.forEach((u) => inFlightLodUrisRef.current.add(u));
          let cancelled = false;
          setResolvingLodUris(true);

          const resolveUri = async (uri) => {
            try {
              const pleiadesMatch = uri.match(/^https?:\/\/pleiades\.stoa\.org\/places\/(\d+)/i);
              if (pleiadesMatch) {
                const resp = await fetch(`https://pleiades.stoa.org/places/${pleiadesMatch[1]}/json`);
                if (resp.ok) {
                  const data = await resp.json();
                  const reprPoint = Array.isArray(data.reprPoint) ? data.reprPoint : null;
                  if (reprPoint && reprPoint.length >= 2) {
                    return {
                      uri,
                      coords: {
                        lon: Number(reprPoint[0]),
                        lat: Number(reprPoint[1]),
                        source: 'Pleiades LOD'
                      }
                    };
                  }
                }
              }

              const geonamesMatch = uri.match(/^https?:\/\/(?:www\.)?geonames\.org\/(\d+)/i);
              if (geonamesMatch) {
                const resp = await fetch(
                  `https://secure.geonames.org/getJSON?geonameId=${geonamesMatch[1]}&username=demo`
                );
                if (resp.ok) {
                  const data = await resp.json();
                  if (data.lat !== undefined && data.lng !== undefined) {
                    return {
                      uri,
                      coords: {
                        lat: Number(data.lat),
                        lon: Number(data.lng),
                        source: 'GeoNames LOD'
                      }
                    };
                  }
                }
              }
            } catch (err) {}
            return { uri, coords: null };
          };

          Promise.all(Array.from(candidateUris).map(resolveUri)).then((results) => {
            if (cancelled) return;
            setLodGeoCache((prev) => {
              const next = { ...prev };
              results.forEach(({ uri, coords }) => {
                next[uri] = coords;
              });
              return next;
            });
            setResolvingLodUris(false);
          });

          return () => {
            cancelled = true;
          };
        }, [files, mappings]);

        const transformedRecords = useMemo(() => {
          return files.map((file) => {
            const rec = transformFileToTargetJson(file, mappings);
            if (
              rec.geography &&
              typeof rec.geography === 'object' &&
              (rec.geography.latitude === 'N/A' || rec.geography.longitude === 'N/A')
            ) {
              const ancientPlaces = Array.isArray(rec.geography.ancient_place_name)
                ? rec.geography.ancient_place_name
                : [];
              const provinces = Array.isArray(rec.geography.province)
                ? rec.geography.province
                : [];
              const candidateEntries = [...ancientPlaces, ...provinces];

              for (const entry of candidateEntries) {
                if (!entry?.uri) continue;
                const normalized = entry.uri.replace(/^http:\/\//i, 'https://').replace(/\/$/, '');
                const resolved = lodGeoCache[normalized] || lodGeoCache[entry.uri];
                if (resolved && resolved.lat !== undefined && resolved.lon !== undefined) {
                  rec.geography = {
                    ...rec.geography,
                    latitude: rec.geography.latitude === 'N/A' ? resolved.lat : rec.geography.latitude,
                    longitude: rec.geography.longitude === 'N/A' ? resolved.lon : rec.geography.longitude,
                    coordinate_source: `${resolved.source} (${normalized})`
                  };
                  break;
                }
              }
            }
            return rec;
          });
        }, [files, mappings, lodGeoCache]);

        const previewJsonString = useMemo(() => {
          if (selectedPreviewIdx === 'ALL') {
            if (transformedRecords.length > 25) {
              const slice = transformedRecords.slice(0, 25);
              return (
                JSON.stringify(slice, null, 2) +
                `\n\n// ... Showing first 25 of ${transformedRecords.length} batch records in preview. Use Batch Export buttons above to download all ${transformedRecords.length} records.`
              );
            }
            return JSON.stringify(transformedRecords, null, 2);
          }
          const idx = Number(selectedPreviewIdx);
          const single = transformedRecords[idx] || transformedRecords[0] || null;
          return JSON.stringify(single ? [single] : [], null, 2);
        }, [transformedRecords, selectedPreviewIdx]);

        const handleCopyJson = () => {
          const fullJson = JSON.stringify(transformedRecords, null, 2);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullJson);
          } else {
            const ta = document.createElement('textarea');
            ta.value = fullJson;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          setCopiedJson(true);
          showToast(`Copied all ${transformedRecords.length} JSON records to clipboard.`);
          setTimeout(() => setCopiedJson(false), 2000);
        };

        const handleDownloadJson = () => {
          if (!isValidForExport) return;
          const blob = new Blob([JSON.stringify(transformedRecords, null, 2)], {
            type: 'application/json'
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `epigraphic-batch-${inputMode.toLowerCase()}-${transformedRecords.length}records.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast(`Exported combined JSON (${transformedRecords.length} records).`);
        };

        const handleDownloadNdjson = () => {
          if (!isValidForExport) return;
          const ndjson = transformedRecords.map((rec) => JSON.stringify(rec)).join('\n');
          const blob = new Blob([ndjson], { type: 'application/x-ndjson' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `epigraphic-batch-${inputMode.toLowerCase()}-${transformedRecords.length}records.ndjson`;
          a.click();
          URL.revokeObjectURL(url);
          showToast(`Exported NDJSON stream (${transformedRecords.length} lines).`);
        };

        const handleDownloadBatchZip = async () => {
          if (!isValidForExport || typeof JSZip === 'undefined') return;
          setIsExportingZip(true);
          try {
            const zip = new JSZip();
            const recordsFolder = zip.folder('records');
            const usedFilenames = new Set();

            transformedRecords.forEach((rec, idx) => {
              const baseName = (rec._source_file || `record_${idx + 1}`)
                .replace(/\.(xml|jsonld|ttl|rdf|json)$/i, '')
                .replace(/[^a-zA-Z0-9._-]/g, '_');
              let candidate = `${baseName}.json`;
              let counter = 2;
              while (usedFilenames.has(candidate)) {
                candidate = `${baseName}_${counter}.json`;
                counter += 1;
              }
              usedFilenames.add(candidate);
              recordsFolder.file(candidate, JSON.stringify(rec, null, 2));
            });

            zip.file(
              'batch_manifest.json',
              JSON.stringify(
                {
                  exported_at: new Date().toISOString(),
                  input_format: inputMode === 'XML' ? 'EpiDoc XML' : 'RDF',
                  record_count: transformedRecords.length,
                  alignment_profile: mappings
                },
                null,
                2
              )
            );

            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `epialign-batch-${inputMode.toLowerCase()}-${transformedRecords.length}files.zip`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Exported ZIP archive with ${transformedRecords.length} individual JSON files.`);
          } catch (err) {
            showToast('Failed to generate ZIP archive.');
          } finally {
            setIsExportingZip(false);
          }
        };

        const mappedPathsSet = useMemo(() => {
          const s = new Set();
          Object.values(mappings).forEach((rules) => {
            (rules || []).forEach((r) => s.add(`${r.format}::${r.sourcePath}`));
          });
          return s;
        }, [mappings]);

        const activeInspectedEntry = useMemo(() => {
          if (inspectedRule) {
            const currentRules = mappings[inspectedRule.targetKey] || [];
            const stillExists = currentRules.find((r) => r.id === inspectedRule.rule.id);
            if (stillExists) {
              return { targetKey: inspectedRule.targetKey, rule: stillExists };
            }
          }
          for (const target of TARGET_FIELDS) {
            const rules = mappings[target.key] || [];
            if (rules.length > 0) {
              return { targetKey: target.key, rule: rules[0] };
            }
          }
          return null;
        }, [inspectedRule, mappings]);

        const inspectedSnippetsByFile = useMemo(() => {
          if (!activeInspectedEntry) return [];
          const { rule } = activeInspectedEntry;
          const serializer = new XMLSerializer();

          const targetFiles =
            selectedVerifierFile === 'ALL'
              ? files.slice(0, 30)
              : files.filter((f) => f.name === selectedVerifierFile);

          return targetFiles
            .map((file) => {
              const artifact = getParsedFileArtifact(file);

              if (artifact.kind === 'XML' && rule.format === 'EpiDoc XML') {
                const isAttr = rule.sourcePath.includes('/@');
                let elemPath = rule.sourcePath;
                let targetAttr = null;
                if (isAttr) {
                  const splitIdx = rule.sourcePath.lastIndexOf('/@');
                  elemPath = rule.sourcePath.slice(0, splitIdx);
                  targetAttr = rule.sourcePath.slice(splitIdx + 2);
                }

                const matchedElements = artifact.pathIndex.get(elemPath) || [];
                const matches = [];

                for (let i = 0; i < matchedElements.length; i++) {
                  const el = matchedElements[i];
                  let val = null;
                  if (targetAttr) {
                    val = el.getAttribute(targetAttr);
                  } else if (rule.textMode === 'raw') {
                    val = el.innerHTML.trim();
                  } else if (rule.textMode === 'diplomatic') {
                    val = cleanEpigraphicText(el, 'diplomatic');
                  } else {
                    val = cleanEpigraphicText(el, 'interpretive');
                  }
                  if (!val) continue;

                  matches.push({
                    value: String(val),
                    rawSource: serializer.serializeToString(el),
                    uri:
                      el.getAttribute('ref') ||
                      el.getAttribute('corresp') ||
                      el.getAttribute('ana') ||
                      (targetAttr === 'ref' ? val : null),
                    certainty:
                      el.getAttribute('cert') ||
                      el.getAttribute('precision') ||
                      el.getAttribute('evidence') ||
                      null,
                    placeType: !targetAttr ? el.getAttribute('type') || null : null
                  });
                }

                return {
                  fileName: file.name,
                  format: file.format,
                  matches
                };
              }

              if (artifact.kind !== 'XML' && rule.format !== 'EpiDoc XML') {
                const matches = evaluateRdfPredicateCached(artifact, rule.sourcePath, {
                  includeUri: true,
                  includeCertainty: true
                }).map((m) => ({
                  value: String(m.value),
                  rawSource: `${rule.sourcePath} → ${JSON.stringify(m.value)}`,
                  uri: m.uri || null,
                  certainty: m.certainty || null
                }));

                return {
                  fileName: file.name,
                  format: file.format,
                  matches
                };
              }

              return null;
            })
            .filter(Boolean);
        }, [activeInspectedEntry, files, selectedVerifierFile]);

        const activeDropdownTarget = useMemo(
          () => TARGET_FIELDS.find((t) => t.key === openDropdownTarget) || null,
          [openDropdownTarget]
        );

        const dropdownFilteredFields = useMemo(() => {
          const q = dropdownSearch.toLowerCase().trim();
          if (!q) return discoveredFields;
          return discoveredFields.filter(
            (df) =>
              df.path.toLowerCase().includes(q) ||
              df.samples.some((s) => s.toLowerCase().includes(q))
          );
        }, [discoveredFields, dropdownSearch]);

        return (
          <div className="min-h-screen bg-[#F6F5F1] dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-sans text-base leading-relaxed selection:bg-indigo-100 selection:text-indigo-950 dark:selection:bg-indigo-900 dark:selection:text-indigo-100 transition-colors duration-200">
            {/* Top Scholarly Header */}
            <header className="bg-[#162136] dark:bg-slate-900 text-stone-100 border-b border-slate-800 px-4 lg:px-6 py-4 shadow-sm sticky top-0 z-30">
              <div className="max-w-[1720px] mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3.5">
                  <div className="w-11 h-11 rounded-xl bg-amber-500/15 border border-amber-400/30 flex items-center justify-center text-amber-300">
                    <BookOpen className="w-6 h-6" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2.5 flex-wrap">
                      <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                        EpiAlign
                      </h1>
                      <span className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-slate-800 text-amber-300 border border-slate-700">
                        {inputMode === 'XML' ? 'EpiDoc XML → JSON' : 'RDF → JSON'}
                      </span>
                      <a
                        href="/"
                        className="hidden md:inline-flex items-center gap-1 text-xs font-medium text-slate-300 hover:text-amber-300 transition ml-2"
                      >
                        ← Petrified Voices
                      </a>
                    </div>
                    <p className="text-sm text-slate-300 hidden sm:block mt-0.5">
                      Epigraphic Schema Alignment &amp; Linked Open Data Batch Workbench
                    </p>
                  </div>
                </div>

                {/* Action Toolbar */}
                <div className="flex flex-wrap items-center gap-2.5">
                  <button
                    onClick={() => applyAutoSuggest(true)}
                    className="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-stone-100 border border-slate-600 transition cursor-pointer"
                    title={`Automatically align standard ${
                      inputMode === 'XML' ? 'EpiDoc TEI XPaths' : 'RDF predicates'
                    }`}
                  >
                    <Sparkles className="w-4 h-4 text-amber-400" />
                    Auto-suggest Alignments
                  </button>

                  <button
                    onClick={() => {
                      setMappingsByMode((prev) => ({
                        ...prev,
                        [inputMode]: {}
                      }));
                      showToast(`Cleared ${inputMode} field alignments.`);
                    }}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700 transition cursor-pointer"
                    title="Reset current format mappings"
                  >
                    <RotateCcw className="w-4 h-4" />
                    Reset
                  </button>

                  <div className="h-5 w-px bg-slate-700 mx-0.5 hidden md:block" />

                  <button
                    onClick={handleExportProfile}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition cursor-pointer"
                    title="Save current alignment rules as reusable JSON config"
                  >
                    <Download className="w-4 h-4 text-sky-400" />
                    Save Profile
                  </button>

                  <button
                    onClick={() => profileInputRef.current?.click()}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition cursor-pointer"
                    title="Load saved mapping profile JSON"
                  >
                    <FolderOpen className="w-4 h-4 text-sky-400" />
                    Load Profile
                  </button>
                  <input
                    ref={profileInputRef}
                    type="file"
                    accept=".json"
                    onChange={handleImportProfile}
                    className="hidden"
                  />

                  <div className="h-5 w-px bg-slate-700 mx-0.5 hidden sm:block" />

                  {/* Dark Mode Toggle */}
                  <button
                    type="button"
                    onClick={() => setDarkMode((d) => !d)}
                    aria-label={darkMode ? 'Switch to light mode' : 'Switch to dark mode'}
                    title={darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
                    className="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-600 transition cursor-pointer"
                  >
