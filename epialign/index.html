                  )}

                  {!activeInspectedEntry ? (
                    <div className="flex-1 flex flex-col items-center justify-center p-8 text-center bg-stone-50/50 dark:bg-slate-950/40">
                      <div className="w-14 h-14 rounded-full bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 flex items-center justify-center text-indigo-700 dark:text-indigo-300 mb-3.5">
                        <BookOpen className="w-7 h-7" />
                      </div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-slate-100 mb-1.5">
                        No Alignment Selected Yet
                      </h3>
                      <p className="text-sm text-slate-600 dark:text-slate-400 max-w-md leading-relaxed">
                        Align any {inputMode === 'XML' ? 'EpiDoc XML XPath' : 'RDF predicate'} to a target field in the middle column. Full extracted snippets, raw source markup, and LOD metadata will appear here immediately for verification.
                      </p>
                    </div>
                  ) : (
                    <div className="flex-1 p-4 space-y-4">
                      <div className="rounded-xl bg-slate-900 dark:bg-slate-950 text-stone-100 p-3.5 border border-slate-800">
                        <div className="text-xs uppercase tracking-wider text-slate-300 font-semibold mb-1">
                          Aligned Source {inputMode === 'XML' ? 'XPath Expression' : 'RDF Predicate'}
                        </div>
                        <div className="font-mono text-xs text-amber-300 break-all leading-relaxed">
                          {activeInspectedEntry.rule.sourcePath}
                        </div>
                      </div>

                      {inspectedSnippetsByFile.length === 0 ? (
                        <div className="p-5 rounded-xl border-2 border-dashed border-stone-300 dark:border-slate-700 text-center text-sm text-slate-600 dark:text-slate-400">
                          Upload or load test files to inspect extracted values for this alignment.
                        </div>
                      ) : (
                        inspectedSnippetsByFile.map((fileGroup) => (
                          <div
                            key={fileGroup.fileName}
                            className="rounded-xl border border-stone-300 dark:border-slate-700 bg-stone-50/80 dark:bg-slate-800/50 p-4 space-y-3.5 shadow-2xs"
                          >
                            <div className="flex items-center justify-between border-b border-stone-200 dark:border-slate-700 pb-2.5 flex-wrap gap-2">
                              <div className="flex items-center gap-2">
                                <span className="px-2 py-0.5 rounded text-xs font-bold uppercase bg-white dark:bg-slate-900 border border-stone-300 dark:border-slate-700 text-slate-800 dark:text-slate-200">
                                  {fileGroup.format}
                                </span>
                                <span className="text-sm font-bold text-slate-900 dark:text-slate-100 break-all">
                                  {fileGroup.fileName}
                                </span>
                              </div>
                              <span
                                className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${
                                  fileGroup.matches.length > 0
                                    ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-900 dark:text-emerald-200'
                                    : 'bg-amber-100 dark:bg-amber-500/20 text-amber-950 dark:text-amber-200'
                                }`}
                              >
                                {fileGroup.matches.length}{' '}
                                {fileGroup.matches.length === 1 ? 'match' : 'matches'}
                              </span>
                            </div>

                            {fileGroup.matches.length === 0 ? (
                              <div className="space-y-2">
                                <p className="text-sm text-amber-950 dark:text-amber-200 bg-amber-50 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-700 rounded-lg p-3 leading-relaxed">
                                  This file does not contain a value at this path, outputting <code className="font-mono font-bold">N/A</code> in JSON. You can align an additional fallback {inputMode === 'XML' ? 'XPath' : 'predicate'} to the same target field.
                                </p>
                              </div>
                            ) : (
                              fileGroup.matches.map((m, idx) => (
                                <div
                                  key={idx}
                                  className="space-y-3 bg-white dark:bg-slate-900 rounded-xl border border-stone-200 dark:border-slate-700 p-3.5"
                                >
                                  {(verifierViewMode === 'split' ||
                                    verifierViewMode === 'extracted') && (
                                    <div>
                                      <div className="flex items-center justify-between mb-1.5 flex-wrap gap-1">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                                          Extracted JSON Value {fileGroup.matches.length > 1 ? `#${idx + 1}` : ''}
                                        </span>
                                        <span className="text-xs text-slate-500 dark:text-slate-400">
                                          {activeInspectedEntry.rule.textMode === 'raw'
                                            ? 'Raw XML preserved'
                                            : activeInspectedEntry.rule.textMode === 'diplomatic'
                                            ? 'Diplomatic (editorial <ex>/<supplied> stripped)'
                                            : 'Interpretive (normalized text)'}
                                        </span>
                                      </div>
                                      <textarea
                                        readOnly
                                        aria-label="Extracted JSON Value"
                                        rows={Math.min(6, Math.max(2, Math.ceil(m.value.length / 44)))}
                                        value={m.value}
                                        className="w-full text-base font-serif text-slate-950 dark:text-slate-100 bg-amber-50/50 dark:bg-slate-950 border border-stone-300 dark:border-slate-700 rounded-lg p-3 leading-relaxed resize-y focus:outline-none focus:border-indigo-600"
                                      />
                                    </div>
                                  )}

                                  {(verifierViewMode === 'split' || verifierViewMode === 'raw') && (
                                    <div>
                                      <div className="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
                                        Original {inputMode === 'XML' ? 'EpiDoc XML Element' : 'RDF Triple'} Context
                                      </div>
                                      <pre className="p-3 rounded-lg bg-slate-900 dark:bg-slate-950 text-stone-100 font-mono text-xs leading-relaxed whitespace-pre-wrap break-all overflow-x-auto border border-slate-800">
                                        {m.rawSource}
                                      </pre>
                                    </div>
                                  )}

                                  {(m.uri || m.certainty || m.placeType) && (
                                    <div className="pt-1 flex flex-wrap items-center gap-2 text-xs">
                                      {m.placeType && (
                                        <span className="inline-flex items-center gap-1.5 text-amber-950 dark:text-amber-200 bg-amber-50 dark:bg-amber-950/60 px-3 py-1 rounded-lg border border-amber-300 dark:border-amber-700 font-semibold text-xs">
                                          type: {m.placeType}
                                        </span>
                                      )}
                                      {m.uri && (
                                        <span className="inline-flex items-center gap-1.5 text-indigo-900 dark:text-indigo-200 bg-indigo-50 dark:bg-indigo-950/60 px-3 py-1 rounded-lg border border-indigo-300 dark:border-indigo-700 break-all font-mono text-xs">
                                          <LinkIcon className="w-3.5 h-3.5 shrink-0 text-indigo-700 dark:text-indigo-400" />
                                          {m.uri}
                                        </span>
                                      )}
                                      {m.certainty && (
                                        <span className="inline-flex items-center gap-1.5 text-purple-900 dark:text-purple-200 bg-purple-50 dark:bg-purple-950/60 px-3 py-1 rounded-lg border border-purple-300 dark:border-purple-700 font-semibold text-xs">
                                          <HelpCircle className="w-3.5 h-3.5 shrink-0 text-purple-700 dark:text-purple-400" />
                                          certainty: {m.certainty}
                                        </span>
                                      )}
                                    </div>
                                  )}
                                </div>
                              ))
                            )}
                          </div>
                        ))
                      )}
                    </div>
                  )}
                </section>
              </div>

              {/* =================================================================== */}
              {/* BOTTOM FULL-WIDTH PANEL: STEP 4B — BATCH EXPORT & JSON OUTPUT       */}
              {/* =================================================================== */}
              <section
                className={`bg-[#121927] dark:bg-slate-900 text-stone-100 rounded-xl border border-slate-800 shadow-sm flex flex-col overflow-hidden ${
                  activeTabMobile !== 'output' ? 'hidden lg:flex' : 'flex'
                }`}
              >
                <div className="px-4 py-3.5 bg-[#192336] dark:bg-slate-950 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5 flex-wrap">
                    <span className="px-2 py-0.5 rounded text-xs font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      Step 4 Batch Export
                    </span>
                    <FileJson className="w-5 h-5 text-emerald-400" />
                    <h2 className="text-sm font-bold uppercase tracking-wider text-slate-100">
                      Live Generated JSON Output
                    </h2>
                    <span className="text-xs text-slate-300 hidden sm:inline">
                      , Preserves LOD <code className="text-sky-300">uri</code>,{' '}
                      <code className="text-purple-300">certainty</code> &amp; LOD coordinates (
                      {transformedRecords.length} record{transformedRecords.length === 1 ? '' : 's'})
                    </span>
                    {resolvingLodUris && (
                      <span className="text-xs text-amber-300 animate-pulse">
                        Resolving LOD coordinates...
                      </span>
                    )}
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <div className="flex items-center gap-2 text-xs">
                      <span className="text-slate-300 font-medium">Preview:</span>
                      <select
                        aria-label="Preview scope"
                        value={selectedPreviewIdx}
                        onChange={(e) => setSelectedPreviewIdx(e.target.value)}
                        className="bg-slate-900 border border-slate-700 text-stone-100 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:border-sky-500 max-w-[230px]"
                      >
                        <option value="ALL">
                          {transformedRecords.length > 25
                            ? `Batch Preview (First 25 of ${transformedRecords.length})`
                            : `All Records (${transformedRecords.length} files)`}
                        </option>
                        {files.slice(0, 100).map((f, idx) => (
                          <option key={f.id} value={idx}>
                            Record {idx + 1}: {f.name}
                          </option>
                        ))}
                      </select>
                    </div>

                    <button
                      onClick={handleCopyJson}
                      disabled={transformedRecords.length === 0}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition cursor-pointer disabled:opacity-50"
                    >
                      {copiedJson ? (
                        <>
                          <Check className="w-4 h-4 text-emerald-400" />
                          Copied
                        </>
                      ) : (
                        <>
                          <Copy className="w-4 h-4" />
                          Copy All
                        </>
                      )}
                    </button>

                    <button
                      onClick={handleDownloadJson}
                      disabled={!isValidForExport}
                      title={
                        isValidForExport
                          ? 'Download single combined JSON array containing all batch records'
                          : 'Map all 3 mandatory fields to enable export'
                      }
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        isValidForExport
                          ? 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer shadow-xs'
                          : 'bg-slate-800 text-slate-400 border border-slate-700 cursor-not-allowed'
                      }`}
                    >
                      <Download className="w-4 h-4" />
                      Batch JSON ({transformedRecords.length})
                    </button>

                    <button
                      onClick={handleDownloadNdjson}
                      disabled={!isValidForExport}
                      title={
                        isValidForExport
                          ? 'Download Newline-Delimited JSON (.ndjson) for large corpora'
                          : 'Map all 3 mandatory fields to enable export'
                      }
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        isValidForExport
                          ? 'bg-sky-600 hover:bg-sky-500 text-white cursor-pointer shadow-xs'
                          : 'bg-slate-800 text-slate-400 border border-slate-700 cursor-not-allowed'
                      }`}
                    >
                      <Download className="w-4 h-4" />
                      NDJSON
                    </button>

                    <button
                      onClick={handleDownloadBatchZip}
                      disabled={!isValidForExport || isExportingZip}
                      title={
                        isValidForExport
                          ? 'Download ZIP archive with one individual JSON file per inscription + manifest'
                          : 'Map all 3 mandatory fields to enable export'
                      }
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        isValidForExport
                          ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 cursor-pointer shadow-xs'
                          : 'bg-slate-800 text-slate-400 border border-slate-700 cursor-not-allowed'
                      }`}
                    >
                      <Archive className="w-4 h-4" />
                      {isExportingZip ? 'Zipping...' : 'Batch ZIP'}
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-auto p-4 font-mono text-sm leading-relaxed">
                  <pre className="text-stone-100 whitespace-pre-wrap break-words">
                    {previewJsonString}
                  </pre>
                </div>
              </section>
            </main>

            {/* PORTAL-BACKED ALIGN PICKER MODAL (Always on top, never clipped by any container) */}
            {activeDropdownTarget &&
              createPortal(
                <div
                  role="dialog"
                  aria-modal="true"
                  aria-label={`Align ${activeDropdownTarget.label}`}
                  onClick={() => {
                    setOpenDropdownTarget(null);
                    setDropdownSearch('');
                  }}
                  className="fixed inset-0 z-[9999] bg-slate-950/60 backdrop-blur-[1px] flex items-center justify-center p-4"
                >
                  <div
                    onClick={(e) => e.stopPropagation()}
                    className="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border-2 border-stone-300 dark:border-slate-700 overflow-hidden flex flex-col max-h-[85vh] animate-fade-in"
                  >
                    <div className="px-5 py-4 bg-stone-50 dark:bg-slate-800/90 border-b border-stone-200 dark:border-slate-700 flex items-center justify-between gap-3">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-indigo-700 dark:text-amber-300">
                          Align Target Attribute
                        </span>
                        <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                          {activeDropdownTarget.label}
                        </h3>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          setOpenDropdownTarget(null);
                          setDropdownSearch('');
                        }}
                        aria-label="Close alignment picker"
                        className="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-stone-300 dark:border-slate-600 hover:bg-stone-100 dark:hover:bg-slate-800 cursor-pointer"
                      >
                        Close
                      </button>
                    </div>

                    <div className="p-3.5 border-b border-stone-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                      <div className="relative">
                        <Search className="w-4 h-4 text-slate-500 dark:text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                        <input
                          type="text"
                          autoFocus
                          value={dropdownSearch}
                          onChange={(e) => setDropdownSearch(e.target.value)}
                          placeholder="Search XPath, RDF predicate, or sample snippet..."
                          className="w-full pl-9 pr-3 py-2.5 text-sm bg-stone-50 dark:bg-slate-950 border border-stone-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl focus:outline-none focus:border-indigo-600 dark:focus:border-amber-400"
                        />
                      </div>
                    </div>

                    <div className="overflow-y-auto divide-y divide-stone-200 dark:divide-slate-800 flex-1">
                      {dropdownFilteredFields.length === 0 ? (
                        <div className="p-8 text-center text-sm text-slate-600 dark:text-slate-400">
                          No matching fields found. Load or upload {inputMode} files first to discover fields.
                        </div>
                      ) : (
                        dropdownFilteredFields.map((df) => {
                          const conciseFiles =
                            df.files.length > 2
                              ? `${df.files.slice(0, 2).join(', ')}...`
                              : df.files.join(', ');
                          return (
                            <button
                              key={df.key}
                              type="button"
                              onClick={() => addMappingRule(activeDropdownTarget.key, df)}
                              className="w-full text-left px-5 py-3.5 hover:bg-indigo-50/80 dark:hover:bg-slate-800 transition flex flex-col gap-1.5 cursor-pointer"
                            >
                              <div className="flex items-center justify-between gap-2">
                                <span
                                  className={`text-xs font-bold px-2 py-0.5 rounded shrink-0 ${
                                    df.format === 'EpiDoc XML'
                                      ? 'bg-amber-100 dark:bg-amber-500/20 text-amber-950 dark:text-amber-200'
                                      : 'bg-sky-100 dark:bg-sky-500/20 text-sky-950 dark:text-sky-200'
                                  }`}
                                >
                                  {df.format}
                                </span>
                                <span
                                  className="text-xs text-slate-600 dark:text-slate-400 font-mono truncate"
                                  title={df.files.join(', ')}
                                >
                                  {conciseFiles}
                                </span>
                              </div>
                              <span className="font-mono text-xs text-slate-900 dark:text-slate-100 break-all leading-relaxed">
                                {df.path}
                              </span>
                              {df.samples.length > 0 && (
                                <div className="mt-1 text-sm text-slate-900 dark:text-slate-200 bg-amber-50/80 dark:bg-slate-950/80 border border-stone-200 dark:border-slate-700 px-3 py-2 rounded-lg font-serif leading-relaxed break-words">
                                  “{df.samples.join('” | “')}”
                                </div>
                              )}
                            </button>
                          );
                        })
                      )}
                    </div>
                  </div>
                </div>,
                document.body
              )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
